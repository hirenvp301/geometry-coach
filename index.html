<script>
"use strict";

/* ---------- utilities ---------- */
const A_COL='#f2711c', B_COL='#0e9f8e', C_COL='#3550e6';
const MINUS='−';
const rad=d=>d*Math.PI/180;
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
const fmtN=n=>n<0?MINUS+(-n):''+n;               // signed number text
const par=n=>n<0?'('+MINUS+(-n)+')':''+n;          // number in parentheses if negative
let UID=0;
class Q{
  constructor(n,d=1){if(d<0){n=-n;d=-d;}const g=gcd(n,d);this.n=n/g;this.d=d/g;if(this.n===0)this.d=1;}
  static of(x){return x instanceof Q?x:new Q(x,1);}
  add(o){o=Q.of(o);return new Q(this.n*o.d+o.n*this.d,this.d*o.d);}
  sub(o){return this.add(Q.of(o).neg());}
  mul(o){o=Q.of(o);return new Q(this.n*o.n,this.d*o.d);}
  div(o){o=Q.of(o);return new Q(this.n*o.d,this.d*o.n);}
  neg(){return new Q(-this.n,this.d);}
  abs(){return new Q(Math.abs(this.n),this.d);}
  val(){return this.n/this.d;}
  isInt(){return this.d===1;}
  eq(o){o=Q.of(o);return this.n===o.n&&this.d===o.d;}
  txt(){return (this.n<0?MINUS:'')+(this.d===1?Math.abs(this.n):Math.abs(this.n)+'/'+this.d);}
  html(){if(this.d===1)return (this.n<0?MINUS:'')+Math.abs(this.n);return (this.n<0?MINUS:'')+`<span class="frac"><span>${Math.abs(this.n)}</span><span>${this.d}</span></span>`;}
  ph(){return this.n<0?'('+this.html()+')':this.html();} // parenthesized html when negative
}
function fracH(n,d){return `<span class="frac"><span>${n}</span><span>${d}</span></span>`;}
function mxH(m){m=Q.of(m);const a=m.abs();const coef=(a.n===1&&a.d===1)?'':a.html();return (m.n<0?MINUS:'')+coef+'x';}
function lineH(m,b){m=Q.of(m);b=Q.of(b);let s='y = ';if(m.n===0)return s+b.html();s+=mxH(m);if(b.n!==0)s+=(b.n<0?' '+MINUS+' ':' + ')+b.abs().html();return `<span class="eq">${s}</span>`;}
function expr(p,q){let s=(p===1?'':p)+'x';if(q>0)s+=' + '+q;else if(q<0)s+=' '+MINUS+' '+(-q);return s;}
function simpRad(n){let out=1,inn=n;for(let k=Math.floor(Math.sqrt(n));k>1;k--){if(inn%(k*k)===0){out*=k;inn/=k*k;break;}}return [out,inn];}
function radH(n){const [o,i]=simpRad(n);if(i===1)return ''+o;return (o===1?'':o)+'√'+i;}
/* answer parsing: numbers, fractions, decimals, √ */
function parseAns(raw){
  let s=(raw||'').toString().trim().toLowerCase().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/[°,$]/g,'').replace(/√/g,'sqrt').replace(/×|·/g,'*').replace(/π/g,'pi');
  let pct=false;if(s.endsWith('%')){pct=true;s=s.slice(0,-1);}
  if(!s)return NaN;
  if(/^(undefined|undef|none|novalue|noslope|dne)$/.test(s))return 'undef';
  let i=0;
  function num(){const j=i;while(i<s.length&&/[0-9.]/.test(s[i]))i++;if(j===i)throw 0;return parseFloat(s.slice(j,i));}
  function factor(){if(s[i]==='-'){i++;return -factor();}if(s[i]==='+'){i++;return factor();}
    if(s.startsWith('sqrt',i)){i+=4;return Math.sqrt(factor());}
    if(s.startsWith('pi',i)){i+=2;return Math.PI;}
    if(s[i]==='('){i++;const v=ex();if(s[i]!==')')throw 0;i++;return v;}return num();}
  function term(){let v=factor();while(i<s.length){if(s[i]==='*'){i++;v*=factor();}else if(s[i]==='/'){i++;v/=factor();}else if(s.startsWith('sqrt',i)||s.startsWith('pi',i)||s[i]==='('){v*=factor();}else break;}return v;}
  function ex(){let v=term();while(i<s.length&&(s[i]==='+'||s[i]==='-')){const op=s[i++];const t=term();v=op==='+'?v+t:v-t;}return v;}
  try{let v=ex();if(i!==s.length)return NaN;if(pct)v/=100;return isFinite(v)?v:NaN;}catch(e){return NaN;}
}
function near(u,a,tol){if(a==='undef')return u==='undef';return typeof u==='number'&&!isNaN(u)&&Math.abs(u-a)<=(tol??0.011)+1e-9;}

/* ---------- transversal diagram ---------- */
function angleRegions(th,ph){return {1:[th,180],2:[0,th],3:[180,180+th],4:[180+th,360],5:[th,180+ph],6:[ph,th],7:[180+ph,180+th],8:[180+th,360+ph]};}
function angleMeasures(th,ph=0){const r=angleRegions(th,ph),o={};for(const k in r)o[k]=Math.round((r[k][1]-r[k][0])*10)/10;return o;}
function tDiagram(o={}){
  const th=o.theta??62, ph=o.phi??0, W=472,H=330,yT=110,yB=230;
  const cot=Math.cos(rad(th))/Math.sin(rad(th));
  const T={x:230+60*cot,y:yT}, B={x:230-60*cot,y:yB};
  const d={x:Math.cos(rad(th)),y:-Math.sin(rad(th))};
  const P=(c,a,r)=>({x:c.x+r*Math.cos(rad(a)),y:c.y-r*Math.sin(rad(a))});
  const reg=angleRegions(th,ph), ctr=n=>n<=4?T:B;
  const bl=x=>B.y-(x-B.x)*Math.tan(rad(ph));
  let s=`<svg viewBox="0 0 ${W} ${H}" class="tdiag" role="img" aria-label="Lines l and m cut by transversal t, angles numbered 1 to 8">`;

function genSysSub(){

function genFactorSimple(){
  let p,q;do{p=ri(-9,9);q=ri(-9,9);}while(p===0||q===0||p===q||p===-q);
  const b=p+q,c=p*q;const right=`(${fac(p)})(${fac(q)})`;
  const wrong=[`(${fac(-p)})(${fac(-q)})`,`(${fac(p)})(${fac(-q)})`,`(${fac(-p)})(${fac(q)})`];
  let alt=null;for(let d=1;d<=Math.abs(c);d++)if(c%d===0){const e=c/d;if(d+e!==b&&d!==p&&d!==q){alt=`(${fac(d)})(${fac(e)})`;break;}}
  const ch=[right,...new Set([...wrong,...(alt?[alt]:[])].filter(w=>w!==right))].slice(0,4);
  return mc(`Factor: <span class="math">${quad(1,b,c)}</span>`,ch,0,
    [`Find two numbers that <b>multiply to ${fmtN(c)}</b> and <b>add to ${fmtN(b)}</b>.`,`${fmtN(p)} × ${par(q)} = ${fmtN(c)} and ${fmtN(p)} + ${par(q)} = ${fmtN(b)} ✓`,`So the answer is <b>${right}</b>. Check by FOIL.`],
    `Look for two numbers whose product is c = ${fmtN(c)} and whose sum is b = ${fmtN(b)}.`);

function genFactorA(){

  const cand=[`(${facA(a,q)})(${fac(p)})`,`(${facA(a,-p)})(${fac(-q)})`,`(${facA(a,-p)})(${fac(q)})`,`(${facA(a,p)})(${fac(-q)})`];

     `Split the middle: ${a}x² ${a*q<0?MINUS:'+'} ${Math.abs(a*q)}x ${p<0?MINUS:'+'} ${Math.abs(p)}x ${Cc<0?MINUS:'+'} ${Math.abs(Cc)}`,
     `Group: ${a}x(${fac(q)}) ${p<0?MINUS:'+'} ${Math.abs(p)}(${fac(q)})`,`= <b>${right}</b>`],'Try the AC method: multiply a·c, then split the middle term.');

function genFactorSpecial(){

    [`Both terms share ${k} and x — the <b>GCF is ${k}x</b>.`,`${k}x² ÷ ${k}x = x and ${fmtN(k*m)}x ÷ ${k}x = ${fmtN(m)}.`,`Answer: <b>${r}</b>`],'Always pull out the greatest common factor first.');

function genSolveFactor(){

function genSolveSqrt(){

    [c?`${c>0?'Subtract':'Add'} ${Math.abs(c)}: ${a===1?'':a}x² = ${a*k*k}`:`${a===1?'':a}x² = ${a*k*k}`,...(a>1?[`Divide by ${a}: x² = ${k*k}`]:[]),`Take the square root of both sides — remember ±: <b>x = ±${k}</b>`],

function genSolveFormula(){

    [`a = ${a}, b = ${fmtN(b)}, c = ${fmtN(c)}`,`x = ${fracH(`${MINUS}b ± √(b² ${MINUS} 4ac)`,'2a')}`,`Discriminant: b² ${MINUS} 4ac = ${b*b} ${MINUS} ${4*a*c<0?'('+MINUS+(-4*a*c)+')':4*a*c} = ${D}`,`x = ${fracH(`${fmtN(-b)} ± √${D}`,2*a)}`,`<b>x ≈ ${fm(r2(x1))}</b> or <b>x ≈ ${fm(r2(x2))}</b>`],
    'x = (−b ± √(b² − 4ac)) / 2a. Find the discriminant first.',{unordered:true});

function genDiscrim(){
  const t=pick([0,1,2]);let a,b,c,D;
  do{a=ri(1,4);b=ri(-8,8);c=t===1?null:ri(-8,8);if(t===1){const r=ri(-5,5);a=ri(1,3);b=-2*a*r;c=a*r*r;}D=b*b-4*a*c;}while((t===2&&D<=0)||(t===0&&D>=0));

const SQFREE=[2,3,5,6,7,10,11,13,14,15];
function genSimpRad(){const k=ri(2,9),m=pick(SQFREE),n=k*k*m;

function genProdRad(){let a,b,k,m;do{a=pick([2,3,5,6,7,8,10,12,15]);b=pick([2,3,5,6,8,10,12,14,15,18]);[k,m]=simpRad(a*b);}while(k===1||m===1&&false);

function genAddRad(){const m=pick([2,3,5,6,7]);let k1=ri(1,5),k2=ri(1,5),p=ri(1,6),q=pick([1,2,3,4,-1,-2,-3]);

function genMulRad(){let p,q,a,b,k,m;do{p=ri(1,5);q=ri(1,5);a=pick([2,3,5,6,10]);b=pick([2,3,6,8,10,12,15]);[k,m]=simpRad(a*b);}while(m===1&&k===1);

const ex=(p,q)=>`${p===1?'':p}x ${q<0?MINUS+' '+(-q):q===0?'':'+ '+q}`.trim();
function segFig(names,labels,opts={}){const n=names.length,pts={};names.forEach((k,i)=>pts[k]=[opts.xs?opts.xs[i]:i*4,0]);
  const sl=labels.map(([a,b,t,c])=>[a,b,t,c]);return fig({pts,segs:[[names[0],names[n-1]]],sl,h:150,ticks:opts.ticks||[],lpos:Object.fromEntries(names.map(k=>[k,[0,-16]]))});}
function genSegAdd(){
  let x,p,q,r,s,AB,BC;do{x=ri(2,12);p=ri(1,5);q=ri(-8,10);r=ri(1,5);s=ri(-8,10);AB=p*x+q;BC=r*x+s;}while(AB<2||BC<2);
  const AC=AB+BC,ask=pick(['x','BC','AB']);
  const st=[`Segment Addition Postulate: AB + BC = AC`,`(${ex(p,q)}) + (${ex(r,s)}) = ${AC}`,`${ex(p+r,q+s)} = ${AC} → ${p+r}x = ${AC-q-s} → <b>x = ${x}</b>`];
  if(ask!=='x')st.push(ask==='AB'?`AB = ${p}(${x}) ${q<0?MINUS+' '+(-q):'+ '+q} = <b>${AB}</b>`:`BC = ${r}(${x}) ${s<0?MINUS+' '+(-s):'+ '+s} = <b>${BC}</b>`);
  return num(`B is between A and C. AB = ${ex(p,q)}, BC = ${ex(r,s)}, and AC = ${AC}. Find <b>${ask}</b>.`,ask==='x'?x:ask==='AB'?AB:BC,st,'The two small pieces add up to the whole segment: AB + BC = AC.',
    {visual:segFig(['A','B','C'],[['A','B',ex(p,q),A_COL],['B','C',ex(r,s),B_COL]],{xs:[0,AB/(AC)*12,12]})});
}
function genMidSeg(){
  let x,p,q,r,s;do{x=ri(2,12);p=ri(2,6);r=ri(1,5);}while(p===r);q=ri(-5,15);s=(p-r)*x+q;const AM=p*x+q;if(AM<2)return genMidSeg();
  const ask=pick(['x','AB']);
  return num(`M is the midpoint of <span style="text-decoration:overline">AB</span>. AM = ${ex(p,q)} and MB = ${ex(r,s)}. Find <b>${ask}</b>.`,ask==='x'?x:2*AM,
    [`A midpoint splits a segment into two <b>equal</b> parts: AM = MB.`,`${ex(p,q)} = ${ex(r,s)} → ${p-r}x = ${s-q} → <b>x = ${x}</b>`,...(ask==='AB'?[`AM = ${AM}, so AB = 2 · ${AM} = <b>${2*AM}</b>`]:[`Check: AM = ${AM} and MB = ${AM} ✓`])],'Midpoint means the two halves are equal. Set them equal.',
    {visual:segFig(['A','M','B'],[['A','M',ex(p,q),A_COL],['M','B',ex(r,s),B_COL]],{ticks:[['A','M',1],['M','B',1]]})});
}
function genDist(){let x1,y1,x2,y2;do{x1=ri(-8,8);y1=ri(-8,8);x2=ri(-8,8);y2=ri(-8,8);}while(x1===x2&&y1===y2||Math.abs(x1-x2)+Math.abs(y1-y2)<3);
  const n=(x2-x1)**2+(y2-y1)**2;
  return num(`Find the distance between <span class="A">A(${fmtN(x1)}, ${fmtN(y1)})</span> and <span class="B">B(${fmtN(x2)}, ${fmtN(y2)})</span>.${RADN}`,Math.sqrt(n),
    [`d = √((x₂ ${MINUS} x₁)² + (y₂ ${MINUS} y₁)²)`,`= √((${fmtN(x2)} ${MINUS} ${par(x1)})² + (${fmtN(y2)} ${MINUS} ${par(y1)})²) = √(${par(x2-x1)}² + ${par(y2-y1)}²)`,`= √(${(x2-x1)**2} + ${(y2-y1)**2}) = √${n} = <b>${radH(n)}${Number.isInteger(Math.sqrt(n))?'':' ≈ '+Math.sqrt(n).toFixed(1)}</b>`],
    'Distance formula: square the change in x, square the change in y, add, then square root.',{tol:T1,visual:grid({points:[{x:x1,y:y1,label:'A',color:A_COL},{x:x2,y:y2,label:'B',color:B_COL}],segs:[{x1,y1,x2,y2,color:'#1d2433'}]}),finalH:radH(n)});}
function genMid(){let x1,y1,x2,y2;do{x1=ri(-9,9);y1=ri(-9,9);x2=ri(-9,9);y2=ri(-9,9);}while(x1===x2&&y1===y2);
  const mx=(x1+x2)/2,my=(y1+y2)/2;
  return multi(`Find the midpoint M of <span class="A">A(${fmtN(x1)}, ${fmtN(y1)})</span> and <span class="B">B(${fmtN(x2)}, ${fmtN(y2)})</span>.`,[['x =',mx],['y =',my]],
    [`M = (${fracH('x₁ + x₂',2)}, ${fracH('y₁ + y₂',2)})`,`x: (${fmtN(x1)} + ${par(x2)}) ÷ 2 = ${fmtN(x1+x2)} ÷ 2 = <b>${fm(mx)}</b>`,`y: (${fmtN(y1)} + ${par(y2)}) ÷ 2 = ${fmtN(y1+y2)} ÷ 2 = <b>${fm(my)}</b>`],
    'Average the x-coordinates, then average the y-coordinates.',{visual:grid({points:[{x:x1,y:y1,label:'A',color:A_COL},{x:x2,y:y2,label:'B',color:B_COL}],segs:[{x1,y1,x2,y2,color:'#1d2433'}]}),inputHint:'e.g. 2.5'});}
function genEndpoint(){let x1,y1,mx,my;do{x1=ri(-8,8);y1=ri(-8,8);mx=ri(-6,6);my=ri(-6,6);}while(Math.abs(2*mx-x1)>12||Math.abs(2*my-y1)>12||(mx===x1&&my===y1));
  const x2=2*mx-x1,y2=2*my-y1;
  return multi(`M(${fmtN(mx)}, ${fmtN(my)}) is the midpoint of <span style="text-decoration:overline">AB</span>, and A is (${fmtN(x1)}, ${fmtN(y1)}). Find the coordinates of B.`,[['x =',x2],['y =',y2]],
    [`Midpoint formula backwards: ${fracH(fmtN(x1)+' + x',2)} = ${fmtN(mx)} → ${fmtN(x1)} + x = ${fmtN(2*mx)} → <b>x = ${fmtN(x2)}</b>`,`${fracH(fmtN(y1)+' + y',2)} = ${fmtN(my)} → ${fmtN(y1)} + y = ${fmtN(2*my)} → <b>y = ${fmtN(y2)}</b>`,`Shortcut: the jump from A to M is (${fmtN(mx-x1)}, ${fmtN(my-y1)}). Jump the same amount again from M.`],
    'M is halfway, so B is the same distance past M as A is before it.',{visual:grid({points:[{x:x1,y:y1,label:'A',color:A_COL},{x:mx,y:my,label:'M',color:'#1d2433'}]})});}
function angFig(m,lab,opts={}){const a=Math.min(m,175);const pts={B:[0,0],A:[4,0],C:[4*cosD(a),4*sinD(a)]};
  return fig({pts,segs:[['B','A',{ext:0}],['B','C']],angs:[{at:'B',a:'A',b:'C',label:lab,r:28}],dots:['B'],h:220,...opts});}
function genClassAng(){const t=pick(['acute','right','obtuse','straight','acute','obtuse']);const m=t==='acute'?ri(5,89):t==='right'?90:t==='obtuse'?ri(91,179):180;
  return mcFixed(`m∠ABC = ${m}°. Classify the angle.`,['Acute','Right','Obtuse','Straight'],['acute','right','obtuse','straight'].indexOf(t),
    [`Acute: less than 90°. Right: exactly 90°. Obtuse: between 90° and 180°. Straight: exactly 180°.`,`${m}° is <b>${t}</b>.`],'Compare the angle to 90° and 180°.',{visual:m<180?angFig(m,m+'°'):''});}
function genAngAdd(){let x,p,q,r,s,a1,a2;do{x=ri(3,15);p=ri(1,5);q=ri(-10,20);r=ri(1,5);s=ri(-10,20);a1=p*x+q;a2=r*x+s;}while(a1<10||a2<10||a1+a2>170);
  const tot=a1+a2,ask=pick(['x','ABD']);
  const pts={B:[0,0],A:[5,0],D:[5*cosD(a1),5*sinD(a1)],C:[5*cosD(tot),5*sinD(tot)]};
  return num(`m∠ABD = (${ex(p,q)})°, m∠DBC = (${ex(r,s)})°, and m∠ABC = ${tot}°. Find <b>${ask==='x'?'x':'m∠ABD'}</b>.`,ask==='x'?x:a1,
    [`Angle Addition Postulate: m∠ABD + m∠DBC = m∠ABC`,`(${ex(p,q)}) + (${ex(r,s)}) = ${tot}`,`${ex(p+r,q+s)} = ${tot} → ${p+r}x = ${tot-q-s} → <b>x = ${x}</b>`,...(ask==='x'?[]:[`m∠ABD = ${p}(${x}) ${q<0?MINUS+' '+(-q):'+ '+q} = <b>${a1}°</b>`])],'The two smaller angles add up to the big angle.',
    {visual:fig({pts,segs:[['B','A'],['B','D'],['B','C']],angs:[{at:'B',a:'A',b:'D',r:30,color:A_COL},{at:'B',a:'D',b:'C',r:40,color:B_COL}],dots:['B'],h:230})});}
function genBisector(){let x,p,q,r,s,h;do{x=ri(3,15);p=ri(2,6);r=ri(1,5);}while(p===r);q=ri(-5,15);s=(p-r)*x+q;h=p*x+q;if(h<8||h>85)return genBisector();
  const ask=pick(['x','whole']);
  return num(`<span style="text-decoration:overline">BD</span> bisects ∠ABC. m∠ABD = (${ex(p,q)})° and m∠DBC = (${ex(r,s)})°. Find <b>${ask==='x'?'x':'m∠ABC'}</b>.`,ask==='x'?x:2*h,
    [`An angle bisector splits the angle into two <b>equal</b> angles.`,`${ex(p,q)} = ${ex(r,s)} → ${p-r}x = ${s-q} → <b>x = ${x}</b>`,...(ask==='x'?[]:[`Each half = ${h}°, so m∠ABC = <b>${2*h}°</b>`])],'Bisect means cut into two equal parts.',
    {visual:fig({pts:{B:[0,0],A:[5,0],D:[5*cosD(h),5*sinD(h)],C:[5*cosD(2*h),5*sinD(2*h)]},segs:[['B','A'],['B','D'],['B','C']],angs:[{at:'B',a:'A',b:'D',r:30},{at:'B',a:'D',b:'C',r:30,color:A_COL}],dots:['B'],h:230})});}
function genCompSupp(){const t=pick(['comp','supp']);const tot=t==='comp'?90:180;let x,p,q,r,s,a1;do{x=ri(3,20);p=ri(1,5);q=ri(-10,20);r=ri(1,5);a1=p*x+q;s=tot-a1-r*x;}while(a1<5||tot-a1<5||Math.abs(s)>60);
  return num(`∠1 and ∠2 are <b>${t==='comp'?'complementary':'supplementary'}</b>. m∠1 = (${ex(p,q)})° and m∠2 = (${ex(r,s)})°. Find x.`,x,
    [`${t==='comp'?'Complementary':'Supplementary'} angles add to <b>${tot}°</b>.`,`(${ex(p,q)}) + (${ex(r,s)}) = ${tot}`,`${ex(p+r,q+s)} = ${tot} → ${p+r}x = ${tot-q-s} → <b>x = ${x}</b>`,`Check: ${a1}° + ${tot-a1}° = ${tot}° ✓`],t==='comp'?'Complementary → add to 90°.':'Supplementary → add to 180°.');}
function genCompOf(){const t=pick(['complement','supplement']);const m=t==='complement'?ri(5,85):ri(5,175);const ans=(t==='complement'?90:180)-m;
  return num(`Find the measure of the <b>${t}</b> of a ${m}° angle.`,ans,[`A ${t} adds with the angle to make ${t==='complement'?90:180}°.`,`${t==='complement'?90:180} ${MINUS} ${m} = <b>${ans}°</b>`],'Complement: C for "corner" (90°). Supplement: S for "straight" (180°).',{unit:'°'});}
function genVertLin(){const t=pick(['vert','lin']);let x,p,q,r,s,v;
  if(t==='vert'){do{x=ri(3,18);p=ri(2,6);r=ri(1,5);}while(p===r);q=ri(-10,20);s=(p-r)*x+q;v=p*x+q;if(v<15||v>165)return genVertLin();}
  else{do{x=ri(3,18);p=ri(1,5);q=ri(-10,20);r=ri(1,5);v=p*x+q;s=180-v-r*x;}while(v<15||v>165||Math.abs(s)>60);}
  const o=180-v,pts={O:[0,0],A:[4,0],B:[-4,0],C:[4*cosD(t==='vert'?180-v:v),4*sinD(t==='vert'?180-v:v)]};pts.D=[-pts.C[0],-pts.C[1]];
  const angs=t==='vert'?[{at:'O',a:'C',b:'B',label:'1',color:A_COL},{at:'O',a:'D',b:'A',label:'2',color:B_COL}]:[{at:'O',a:'A',b:'C',label:'1',color:A_COL},{at:'O',a:'C',b:'B',label:'2',color:B_COL}];
  return num(`In the figure, m∠1 = (${ex(p,q)})° and m∠2 = (${ex(r,s)})°. Find x.`,x,
    t==='vert'?[`∠1 and ∠2 are <b>vertical angles</b> (across from each other), so they are congruent.`,`${ex(p,q)} = ${ex(r,s)} → ${p-r}x = ${s-q} → <b>x = ${x}</b>`]:[`∠1 and ∠2 form a <b>linear pair</b> (side by side on a line), so they add to 180°.`,`(${ex(p,q)}) + (${ex(r,s)}) = 180 → ${ex(p+r,q+s)} = 180 → <b>x = ${x}</b>`],
    'Are the angles across from each other (equal) or side by side on a line (add to 180°)?',{visual:fig({pts,segs:[['A','B'],['C','D']],angs,nolab:['O','A','B','C','D'],dots:['O'],h:220})});}

function distSteps(P,m,b,F,k2){ // perpendicular-from-point method

    `<b>Perpendicular line through P(${fmtN(P[0])}, ${fmtN(P[1])}).</b> ${fmtN(P[1])} = ${mp.ph()}(${fmtN(P[0])}) + b → b = ${b2.html()}. So: ${lineH(mp,b2)}`,
    `<b>Where they cross.</b> Set equal: ${mxH(m)} ${Q.of(b).n<0?MINUS+' '+(-b):'+ '+b} = ${mxH(mp)} ${b2.n<0?MINUS:'+'} ${b2.abs().html()} → x = ${fmtN(F[0])}, then y = ${fmtN(F[1])}. The foot is <b>(${fmtN(F[0])}, ${fmtN(F[1])})</b>.`,

{id:'3-2',code:'3.2',title:'Angles and Parallel Lines',desc:'When the lines ARE parallel: which angles are equal, which add to 180°, and solving for x.',
 skills:[{id:'find',name:'Find an angle measure',gen:genFindAngle},{id:'alg',name:'Solve for x',gen:()=>genAlgebra(false)},{id:'cs',name:'Congruent or supplementary?',gen:genCongSupp}],
 cards:[
  {t:'When the lines are parallel…',b:()=>`<div class="two"><div><p>If ℓ ∥ m, the angle pairs from 3.1 follow strict rules.</p><div class="box key"><b>Corresponding Angles Postulate:</b> If two parallel lines are cut by a transversal, corresponding angles are <b>congruent</b>.</div><p>So here ∠1 ≅ ∠5, ∠2 ≅ ∠6, ∠3 ≅ ∠7, ∠4 ≅ ∠8.</p></div>${D({theta:62,arrows:true,hl:hl2(1,5),labels:{1:'118°',5:'118°'}})}</div>`},
  {t:'Three more theorems',b:()=>`<table class="t"><tr><th>If ℓ ∥ m, then…</th><th>Example</th></tr>
    <tr><td><b>Alternate Interior Angles Theorem</b> — alternate interior angles are congruent</td><td>∠3 ≅ ∠6, ∠4 ≅ ∠5</td></tr>
    <tr><td><b>Alternate Exterior Angles Theorem</b> — alternate exterior angles are congruent</td><td>∠1 ≅ ∠8, ∠2 ≅ ∠7</td></tr>
    <tr><td><b>Consecutive Interior Angles Theorem</b> — consecutive interior angles are <b>supplementary</b> (add to 180°)</td><td>m∠3 + m∠5 = 180°</td></tr></table>
    <div class="box warn">Only consecutive interior angles (and linear pairs) <b>add to 180°</b>. All the other pairs are <b>equal</b>.</div>`},
  {t:'The big shortcut: only two sizes',b:()=>`<div class="two"><div><p>With parallel lines, every angle is one of just <b>two sizes</b>:</p><p><span class="A">Small angles</span>: ∠2, ∠3, ∠6, ∠7 — all 62° here.</p><p><span class="B">Big angles</span>: ∠1, ∠4, ∠5, ∠8 — all 118° here.</p><p>And small + big = <b>180°</b>.</p><div class="box tip">Know one angle → you know all eight!</div></div>${D({theta:62,arrows:true,hl:{2:A_COL,3:A_COL,6:A_COL,7:A_COL,1:B_COL,4:B_COL,5:B_COL,8:B_COL},labels:{1:'118°',2:'62°',3:'62°',4:'118°',5:'118°',6:'62°',7:'62°',8:'118°'}})}</div>`},
  {t:'Worked example: chain the angles',b:()=>`<div class="two"><div><p>ℓ ∥ m and m∠1 = 110°. Find m∠7.</p><ol><li>∠1 and ∠5 are corresponding → m∠5 = 110°.</li><li>∠5 and ∠7 are a linear pair → m∠7 = 180° ${MINUS} 110° = <b>70°</b>.</li></ol><p class="muted">Shortcut: ∠1 is a "big" angle, ∠7 is a "small" one → 180 ${MINUS} 110 = 70.</p></div>${D({theta:70,arrows:true,hl:hl2(1,7),labels:{1:'110°',7:'?'}})}</div>`},
  {t:'Worked example: solve for x',b:()=>`<div class="two"><div><p>ℓ ∥ m, m∠3 = (2x + 10)°, m∠6 = (3x ${MINUS} 15)°. Find x.</p><ol><li>∠3 and ∠6 are alternate interior → <b>congruent</b>.</li><li>Set equal: 2x + 10 = 3x ${MINUS} 15</li><li>Subtract 2x: 10 = x ${MINUS} 15</li><li>Add 15: <b>x = 25</b></li><li>Check: 2(25) + 10 = 60 and 3(25) ${MINUS} 15 = 60 ✓</li></ol><div class="box key">Congruent → set them <b>equal</b>. Supplementary → <b>add them = 180</b>.</div></div>${D({theta:60,arrows:true,hl:hl2(3,6),labels:{3:'(2x + 10)°',6:'(3x − 15)°'}})}</div>`},
  {t:'Perpendicular Transversal Theorem',b:()=>`<div class="two"><div><p>In a plane, if a line is <b>perpendicular to one</b> of two parallel lines, it is <b>perpendicular to the other</b> too.</p><p>All 8 angles become 90°.</p></div>${D({theta:90,arrows:true,labels:{2:'90°',6:'90°'},hl:hl2(2,6)})}</div>`}
 ],explore:'measures'},
{id:'3-3',code:'3.3',title:'Slope',desc:'Rise over run, the four kinds of slope, and slopes of parallel & perpendicular lines.',
 skills:[{id:'slope',name:'Slope from two points',gen:genSlope},{id:'pp',name:'Parallel & perpendicular slopes',gen:genPPSlope},{id:'cls',name:'Parallel, perpendicular, or neither',gen:genClassify}],
 cards:[
  {t:'Slope = rise over run',b:()=>`<div class="two"><div><p><b>Slope</b> measures how steep a line is.</p><div class="math">m = ${fracH('rise','run')} = ${fracH('y₂ '+MINUS+' y₁','x₂ '+MINUS+' x₁')}</div><p>Example: A(${MINUS}2, 1) and B(4, 5)</p><div class="math">m = ${fracH('5 '+MINUS+' 1','4 '+MINUS+' ('+MINUS+'2)')} = ${fracH(4,6)} = ${fracH(2,3)}</div><p>Up 2 for every 3 to the right.</p></div>${G({points:[{x:-2,y:1,label:'A',color:A_COL},{x:4,y:5,label:'B',color:B_COL}],lines:[{m:2/3,b:7/3,color:'#b8bfd0'}],segs:[{x1:-2,y1:1,x2:4,y2:1,color:A_COL,dash:true},{x1:4,y1:1,x2:4,y2:5,color:B_COL,dash:true}],texts:[{x:1,y:0.2,t:'run 6',color:A_COL},{x:5.6,y:3,t:'rise 4',color:B_COL}]})}</div>`},
  {t:'Four kinds of slope',b:()=>`<div class="mini4">
    <figure>${grid({min:-5,max:5,lines:[{m:1,b:0}]})}<b>Positive</b>goes up left → right</figure>
    <figure>${grid({min:-5,max:5,lines:[{m:-1,b:1}]})}<b>Negative</b>goes down left → right</figure>
    <figure>${grid({min:-5,max:5,lines:[{m:0,b:2}]})}<b>Zero</b>horizontal (rise = 0)</figure>
    <figure>${grid({min:-5,max:5,lines:[{vx:2}]})}<b>Undefined</b>vertical (run = 0, can't divide by 0)</figure></div>`},
  {t:'Parallel & perpendicular slopes',b:()=>`<div class="two"><div><div class="box key"><b>Parallel lines</b> have the <b>same slope</b>.</div><div class="box key"><b>Perpendicular lines</b> have <b>opposite reciprocal</b> slopes — their product is ${MINUS}1.</div><p>"Flip and switch": slope ${fracH(2,3)} → perpendicular slope ${MINUS}${fracH(3,2)}.</p><p>Check: ${fracH(2,3)} × (${MINUS}${fracH(3,2)}) = ${MINUS}1 ✓</p><p class="muted small">Exception: horizontal (slope 0) and vertical (undefined) lines are perpendicular too.</p></div>${G({lines:[{m:2/3,b:1,color:A_COL},{m:2/3,b:-4,color:A_COL,dash:true},{m:-1.5,b:1,color:B_COL}]})}</div>`},
  {t:'Common mistakes',b:()=>`<div class="box warn"><b>1. Mixed-up order.</b> If you start the top with point B, start the bottom with point B too.</div><div class="box warn"><b>2. Run over rise.</b> y's go on <b>top</b>. "Rise" before "run", like you rise out of bed before you run.</div><div class="box warn"><b>3. Subtracting negatives.</b> 4 ${MINUS} (${MINUS}2) = 4 + 2 = 6. Use parentheses!</div><div class="box tip">Always simplify the fraction: ${fracH(4,6)} → ${fracH(2,3)}.</div>`}
 ],explore:'slope'},
{id:'3-4',code:'3.4',title:'Equations of Lines',desc:'Slope-intercept and point-slope form, lines through two points, and real-world models.',
 skills:[{id:'pt',name:'Slope + point',gen:genEqPointSlope},{id:'two',name:'Two points',gen:genEqTwo},{id:'parperp',name:'Parallel / perpendicular through a point',gen:genEqParPerp},{id:'psf',name:'Point-slope form',gen:genPSForm},{id:'word',name:'Real-world equations',gen:genWord}],
 cards:[
  {t:'Slope-intercept form',b:()=>`<div class="two"><div><div class="math" style="font-size:20px">y = mx + b</div><p><b>m</b> = slope, <b>b</b> = y-intercept (where the line crosses the y-axis).</p><p>Example: y = 2x ${MINUS} 3 has slope 2 and crosses the y-axis at (0, ${MINUS}3).</p></div>${G({lines:[{m:2,b:-3}],points:[{x:0,y:-3,label:'(0, −3)'}]})}</div>`},
  {t:'Point-slope form',b:()=>`<div class="math" style="font-size:20px">y ${MINUS} y₁ = m(x ${MINUS} x₁)</div><p>Use it when you know the <b>slope</b> and <b>one point</b> (x₁, y₁).</p><p>Example: slope 3 through (2, ${MINUS}1):</p><div class="math">y ${MINUS} (${MINUS}1) = 3(x ${MINUS} 2) → y + 1 = 3(x ${MINUS} 2)</div><p>To change it into slope-intercept form, distribute and solve for y:</p><div class="math">y + 1 = 3x ${MINUS} 6 → y = 3x ${MINUS} 7</div>`},
  {t:'Line through two points',b:()=>`<div class="two"><div><p>Through (1, 4) and (3, 10):</p><ol><li><b>Slope:</b> m = ${fracH('10 '+MINUS+' 4','3 '+MINUS+' 1')} = ${fracH(6,2)} = 3</li><li><b>Plug in one point:</b> 4 = 3(1) + b</li><li><b>Solve:</b> b = 1</li><li><b>Write it:</b> y = 3x + 1</li></ol></div>${G({lines:[{m:3,b:1}],points:[{x:1,y:4,label:'(1, 4)',color:A_COL},{x:3,y:10,label:'(3, 10)',color:B_COL}]})}</div>`},
  {t:'Parallel or perpendicular through a point',b:()=>`<div class="two"><div><p>Find the line <b>perpendicular</b> to y = 2x + 5 through (4, 1).</p><ol><li>Given slope 2 → perpendicular slope ${MINUS}${fracH(1,2)}</li><li>1 = ${MINUS}${fracH(1,2)}(4) + b → 1 = ${MINUS}2 + b → b = 3</li><li>y = ${MINUS}${fracH(1,2)}x + 3</li></ol><div class="box key">Parallel → copy the slope. Perpendicular → flip & switch. Then use the point to find b.</div></div>${G({lines:[{m:2,b:5,color:'#1d2433'},{m:-.5,b:3,color:B_COL}],points:[{x:4,y:1,label:'(4, 1)'}]})}</div>`},
  {t:'Horizontal & vertical lines',b:()=>`<div class="two"><div><p><b>Horizontal:</b> y = b (slope 0). Every point has the same y.</p><p><b>Vertical:</b> x = a (undefined slope). Every point has the same x.</p><p>Example: the horizontal line through (3, ${MINUS}2) is <b>y = ${MINUS}2</b>; the vertical line is <b>x = 3</b>.</p></div>${G({lines:[{m:0,b:-2,color:A_COL},{vx:3,color:B_COL}],points:[{x:3,y:-2,label:'(3, −2)',color:'#1d2433'}]})}</div>`},
  {t:'Real-world lines',b:()=>`<p>A streaming service charges a <b>$25</b> sign-up fee plus <b>$10</b> per month.</p><table class="t"><tr><th>Part of the story</th><th>Part of the equation</th></tr><tr><td>Changes every month ($10)</td><td>slope m = 10</td></tr><tr><td>Starting amount ($25)</td><td>y-intercept b = 25</td></tr></table><div class="math">y = 10x + 25</div><p>After 6 months: y = 10(6) + 25 = $85.</p><div class="box tip">Look for "per", "each", "every" → that's the slope. "Starts with", "fee", "initial" → that's b.</div>`}
 ],explore:'eq'},
{id:'3-5',code:'3.5',title:'Proving Lines Parallel',desc:'Flip the theorems around: use angle pairs to prove two lines are parallel. Plus two-column proofs.',
 skills:[{id:'which',name:'Which converse proves it?',gen:genWhich},{id:'alg',name:'Find x so ℓ ∥ m',gen:()=>genAlgebra(true)},{id:'yn',name:'Are the lines parallel?',gen:genYesNo},{id:'pair',name:'Which pair would you use?',gen:genWhichPair},{id:'proof',name:'Complete the proof',gen:genProof}],
 cards:[
  {t:'The big idea: flip it around',b:()=>`<div class="two"><div><p>In <b>3.2</b> you learned:</p><div class="box key"><b>If</b> the lines are parallel, <b>then</b> the angle pairs are congruent (or supplementary).</div><p>In <b>3.5</b> we flip it — this is called the <b>converse</b>:</p><div class="box tip"><b>If</b> the angle pairs are congruent (or supplementary), <b>then</b> the lines are parallel.</div><p>3.2 = "I know the lines are parallel → find the angles."<br>3.5 = "I see the angles → <b>prove</b> the lines are parallel." Like a detective using clues.</p></div>${D({theta:62,hl:hl2(1,5),labels:{1:'118°',5:'118°'}})}</div>`},
  {t:'The Parallel Postulate',b:()=>`<div class="two"><div><div class="box key">Given a line and a point <b>not</b> on the line, there is <b>exactly one</b> line through the point that is parallel to the given line.</div><p>Try to draw a second parallel line through P — you can't! Any other line through P tilts and eventually crashes into the first line.</p></div><div class="vis"><svg viewBox="0 0 420 220" class="tdiag"><line x1="20" y1="160" x2="400" y2="160" class="ln"/><line x1="20" y1="70" x2="400" y2="70" class="ln" style="stroke:#0e9f8e"/><line x1="40" y1="40" x2="380" y2="100" class="ln" style="stroke:#c93b3b;stroke-dasharray:6 5;stroke-width:2"/><circle cx="210" cy="70" r="6" fill="#f2711c"/><text x="210" y="50" class="lab" text-anchor="middle" fill="#f2711c">P</text><text x="404" y="166" class="lname">ℓ</text><text x="300" y="60" class="lab" fill="#0e9f8e">the only parallel</text><text x="300" y="118" class="lab" fill="#c93b3b">tilted → hits ℓ</text></svg></div></div>`},
  {t:'Your 5 tools to prove ℓ ∥ m',b:()=>`<div class="two"><div><table class="t"><tr><th>If you know…</th><th>Then ℓ ∥ m by…</th></tr>
   <tr><td>Corresponding angles ≅<br><span class="muted small">∠1 ≅ ∠5</span></td><td>Converse of the Corresponding Angles Postulate</td></tr>
   <tr><td>Alternate exterior angles ≅<br><span class="muted small">∠1 ≅ ∠8</span></td><td>Alternate Exterior Angles Converse</td></tr>
   <tr><td>Consecutive interior angles <b>supplementary</b><br><span class="muted small">m∠4 + m∠6 = 180°</span></td><td>Consecutive Interior Angles Converse</td></tr>
   <tr><td>Alternate interior angles ≅<br><span class="muted small">∠3 ≅ ∠6</span></td><td>Alternate Interior Angles Converse</td></tr>
   <tr><td>Both lines ⟂ the same line<br><span class="muted small">ℓ ⟂ t and m ⟂ t</span></td><td>Perpendicular Transversal Converse</td></tr></table></div>${D({theta:62})}</div>`},
  {t:'⚠️ The trap: angles that prove nothing',b:()=>`<div class="two"><div><p>Here ℓ and m are <b>not</b> parallel (look at m tilt). Yet:</p><p><span class="A">∠1</span> and <span class="A">∠4</span> are still equal (vertical angles — 118° each).</p><p>Vertical angles and linear pairs are <b>always</b> true, parallel or not. They live at <b>one crossing</b>, so they can't compare the two lines.</p><div class="box warn"><b>Rule:</b> To prove lines parallel, use one angle at the <b>top</b> crossing and one at the <b>bottom</b> crossing.</div><p class="small">Notice ∠1 = 118° but <span class="B">∠5</span> = 106° — the corresponding angles don't match, so the lines aren't parallel.</p></div>${D({theta:62,phi:-12,hl:{1:A_COL,4:A_COL,5:B_COL},labels:{1:'118°',4:'118°',5:'106°'}})}</div>`},
  {t:'Watch out: congruent vs. supplementary',b:()=>`<div class="two"><div><p>Consecutive interior angles must <b>add to 180°</b> to prove parallel lines.</p><p>If someone says "∠3 ≅ ∠5, so ℓ ∥ m" — that's <b>wrong</b>! (Unless both happen to be 90°.)</p><div class="box key">✔ m∠3 + m∠5 = 180° → ℓ ∥ m<br>✘ ∠3 ≅ ∠5 → can't conclude</div></div>${D({theta:62,hl:hl2(3,5),labels:{3:'62°',5:'118°'},arrows:true})}</div>`},
  {t:'Worked example: find x so ℓ ∥ m',b:()=>`<div class="two"><div><p>m∠1 = (4x + 6)°, m∠5 = (5x ${MINUS} 9)°. Find x so that ℓ ∥ m.</p><ol><li>∠1 and ∠5 are <b>corresponding</b>. They must be congruent (Converse of Corresponding Angles Postulate).</li><li>4x + 6 = 5x ${MINUS} 9</li><li>Subtract 4x: 6 = x ${MINUS} 9</li><li>Add 9: <b>x = 15</b></li><li>Check: 4(15) + 6 = 66° and 5(15) ${MINUS} 9 = 66° ✓</li></ol></div>${D({theta:114,hl:hl2(1,5),labels:{1:'(4x + 6)°',5:'(5x − 9)°'}})}</div>`},
  {t:'Worked example: supplementary version',b:()=>`<div class="two"><div><p>m∠4 = (3x + 10)°, m∠6 = (2x + 20)°. Find x so that ℓ ∥ m.</p><ol><li>∠4 and ∠6 are <b>consecutive interior</b>. They must be <b>supplementary</b>.</li><li>(3x + 10) + (2x + 20) = 180</li><li>5x + 30 = 180</li><li>5x = 150 → <b>x = 30</b></li><li>Check: 100° + 80° = 180° ✓</li></ol></div>${D({theta:80,hl:hl2(4,6),labels:{4:'(3x + 10)°',6:'(2x + 20)°'}})}</div>`},
  {t:'Two-column proof, step by step',b:()=>`<div class="two"><div><p><b>Given:</b> ∠2 ≅ ∠7 &nbsp; <b>Prove:</b> ℓ ∥ m</p><table class="t"><tr><th>Statement</th><th>Reason</th></tr><tr><td>1. ∠2 ≅ ∠7</td><td>Given</td></tr><tr><td>2. ∠2 ≅ ∠3</td><td>Vertical Angles Theorem</td></tr><tr><td>3. ∠3 ≅ ∠7</td><td>Transitive Property of Congruence</td></tr><tr><td>4. ℓ ∥ m</td><td>Converse of the Corresponding Angles Postulate</td></tr></table><p class="small muted">Why step 3? ∠3 ≅ ∠2 and ∠2 ≅ ∠7, so ∠3 ≅ ∠7 — just like if a = b and b = c, then a = c. (Some teachers accept "Substitution" here.)</p><p class="small">Shortcut: ∠2 and ∠7 are <i>alternate exterior</i>, so the Alternate Exterior Angles Converse proves it in one step. Proofs can take different paths!</p></div>${D({theta:62,hl:{2:A_COL,7:B_COL,3:C_COL}})}</div>`},
  {t:'Your strategy checklist',b:()=>`<ol class="readout"><li><b>Find</b> the two angles in the diagram.</li><li><b>Check:</b> is one at the top crossing and one at the bottom? If not → can't prove parallel.</li><li><b>Name</b> the pair: corresponding, alternate interior, alternate exterior, or consecutive interior.</li><li><b>Test:</b> congruent pairs must be equal; consecutive interior must add to 180°.</li><li><b>Cite</b> the matching converse as your reason.</li></ol><div class="box tip">Ready? Try <b>Explore</b> to see the converse in action, then <b>Practice</b> one problem at a time.</div>`}
 ],explore:'converse'},
{id:'3-6',code:'3.6',title:'Perpendiculars and Distance',desc:'Shortest distance from a point to a line, and between two parallel lines.',
 skills:[{id:'hv',name:'Horizontal & vertical distance',gen:genDistHV},{id:'pl',name:'Point to line',gen:genDistPL},{id:'par',name:'Between parallel lines',gen:genDistPar}],
 cards:[
  {t:'Distance = the perpendicular path',b:()=>`<div class="two"><div><p>The <b>distance from a point to a line</b> is the length of the <b>perpendicular</b> segment from the point to the line.</p><p>It's the <b>shortest</b> path — any slanted path is longer.</p><p>Think: the fastest way to walk to a straight road is to walk straight at it, at a right angle.</p></div>${G({lines:[{m:2,b:0,color:'#1d2433'}],points:[{x:0,y:5,label:'P'},{x:2,y:4,label:'F',color:B_COL}],segs:[{x1:0,y1:5,x2:2,y2:4,color:B_COL},{x1:0,y1:5,x2:-1,y2:-2,color:'#c93b3b',dash:true}]})}</div>`},
  {t:'Easy case: horizontal & vertical lines',b:()=>`<div class="two"><div><p>Distance from P(3, 5) to the line y = ${MINUS}2:</p><p>The perpendicular goes straight down to (3, ${MINUS}2).</p><div class="math">d = |5 ${MINUS} (${MINUS}2)| = 7</div><p>Same idea for x = a lines: just subtract the x-coordinates.</p></div>${G({lines:[{m:0,b:-2,color:'#1d2433'}],points:[{x:3,y:5,label:'P(3, 5)'}],segs:[{x1:3,y1:5,x2:3,y2:-2,color:B_COL,dash:true}]})}</div>`},
  {t:'The 4-step method (slanted lines)',b:()=>`<div class="two"><div><p>Find the distance from P(0, 5) to y = 2x.</p><ol><li><b>Perpendicular slope:</b> 2 → ${MINUS}${fracH(1,2)}</li><li><b>Perpendicular line through P:</b> y = ${MINUS}${fracH(1,2)}x + 5</li><li><b>Where they cross:</b> 2x = ${MINUS}${fracH(1,2)}x + 5 → ${fracH(5,2)}x = 5 → x = 2, y = 4. Foot F(2, 4).</li><li><b>Distance formula:</b> d = √((0 ${MINUS} 2)² + (5 ${MINUS} 4)²) = √5 ≈ 2.24</li></ol></div>${G({lines:[{m:2,b:0,color:'#1d2433'},{m:-.5,b:5,color:B_COL,dash:true}],points:[{x:0,y:5,label:'P'},{x:2,y:4,label:'F',color:B_COL}]})}</div>`},
  {t:'Distance between parallel lines',b:()=>`<div class="two"><div><p>Parallel lines stay the same distance apart everywhere. To measure it:</p><ol><li><b>Pick any point</b> on one line (the y-intercept is easiest).</li><li>Find that point's distance to the <b>other</b> line (4-step method).</li></ol><p>Example: y = 2x + 5 and y = 2x. Use (0, 5) on the first line. From the last card, its distance to y = 2x is √5 ≈ 2.24.</p></div>${G({lines:[{m:2,b:5,color:A_COL},{m:2,b:0,color:B_COL}],points:[{x:0,y:5,label:'(0, 5)'},{x:2,y:4,color:B_COL}],segs:[{x1:0,y1:5,x2:2,y2:4,color:'#1d2433',dash:true}]})}</div>`},
  {t:'Distance formula refresher',b:()=>`<div class="math" style="font-size:19px">d = √((x₂ ${MINUS} x₁)² + (y₂ ${MINUS} y₁)²)</div><p>Simplify radicals from Unit 0: √20 = √(4·5) = 2√5. √18 = 3√2.</p><div class="box tip">In practice you can type an exact answer like <b>2√5</b> (or 2sqrt5), or a decimal rounded to hundredths like <b>4.47</b>.</div>`}
 ],explore:'dist'}
]});

/* ================= UNIT 4: CONGRUENCY ================= */
/* triangle figure: angles at the 3 vertices, names, labels */
function triFig(o){const [a,b,c]=o.ang||[60,60,60];const n=o.names||['A','B','C'];const P0=triAng(a,b,c);const pts={[n[0]]:P0.A,[n[1]]:P0.B,[n[2]]:P0.C};
  if(o.flip)for(const k in pts)pts[k]=[-pts[k][0],pts[k][1]];
  const angs=[],sl=[],ticks=[],rights=[],segs=[];
  const other=v=>n.filter(x=>x!==v);
  for(const v in o.al||{}){const [p,q]=other(v);angs.push({at:v,a:p,b:q,label:o.al[v],color:o.ac?.[v]||A_COL,n:o.an?.[v]||1});}
  for(const s in o.arcs||{}){const [p,q]=other(s);angs.push({at:s,a:p,b:q,color:o.arcs[s][1]||'#1d2433',n:o.arcs[s][0]});}
  for(const e in o.sl||{})sl.push([e[0],e[1],o.sl[e],o.sc?.[e]||B_COL]);
  for(const e in o.ticks||{})ticks.push([e[0],e[1],o.ticks[e]]);

function congMarks(type){ // returns {ticks:{}, arcs:{}} in terms of A,B,C with random roles

  if(kind==='SAS'){t[side(P,Qv)]=1;t[side(P,R)]=2;a[P]=[1];}
  if(kind==='ASA'){a[P]=[1];a[Qv]=[2];t[side(P,Qv)]=1;}

  let x,p,q,r,s;do{x=ri(2,10);p=ri(2,6);q=ri(-5,10);r=ri(1,3);}while(p===2*r);s=(p*x+q)/2-r*x;if(!Number.isInteger(s)||p*x+q<4)return genCentroid();

function genCentroidCoord(){let A,B,Cc;do{A=[ri(-8,8),ri(-8,8)];B=[ri(-8,8),ri(-8,8)];Cc=[ri(-8,8),ri(-8,8)];}while((A[0]+B[0]+Cc[0])%3||(A[1]+B[1]+Cc[1])%3||((B[0]-A[0])*(Cc[1]-A[1])-(B[1]-A[1])*(Cc[0]-A[0]))===0);

function genOrderAngles(){let a,b,c;do{a=ri(4,20);b=ri(4,20);c=ri(4,20);}while(a===b||b===c||a===c||a+b<=c||a+c<=b||b+c<=a);

function genTriIneq(){const yes=Math.random()<.5;let a,b,c;

function genHinge(){const s1=ri(5,15),s2=ri(5,15);let a1,a2;do{a1=ri(20,150);a2=ri(20,150);}while(Math.abs(a1-a2)<6);

function genProportion(){let a,b,d,x,c,k;do{a=ri(2,12);b=ri(2,12);k=ri(1,6);d=b*k;x=ri(-6,15);c=ri(-8,8);}while(a*k-c===x+0&&false||gcd(a,b)!==1);
  // (x + c)/d = a/b  → x + c = a*d/b = a*k
  x=a*k-c;
  return num(`Solve the proportion: <span class="math">${fracH(c?`x ${c<0?MINUS+' '+(-c):'+ '+c}`:'x',d)} = ${fracH(a,b)}</span>`,x,
    [`Cross multiply: ${b}(${c?`x ${c<0?MINUS+' '+(-c):'+ '+c}`:'x'}) = ${a} · ${d}`,`${b}x ${b*c<0?MINUS+' '+(-b*c):b*c?'+ '+b*c:''} = ${a*d}`.replace(/  /g,' '),`${b}x = ${a*d-b*c} → <b>x = ${fmtN(x)}</b>`],'Cross multiply: the product of the means equals the product of the extremes.');}
function genExtRatio(){const r=shuffle([1,2,3,4,5,6,7].slice(0,ri(4,7))).slice(0,3);const s=r[0]+r[1]+r[2];if(180%s){return genExtRatio();}const k=180/s;const want=pick(['largest','smallest']);const ans=(want==='largest'?Math.max(...r):Math.min(...r))*k;
  return num(`The angles of a triangle are in the ratio ${r.join(' : ')}. Find the measure of the <b>${want}</b> angle.`,ans,
    [`Let the angles be ${r[0]}x, ${r[1]}x, ${r[2]}x.`,`${r[0]}x + ${r[1]}x + ${r[2]}x = 180 → ${s}x = 180 → x = ${k}`,`${want==='largest'?'Largest':'Smallest'}: ${want==='largest'?Math.max(...r):Math.min(...r)} · ${k} = <b>${ans}°</b>`],'Write each angle as (ratio number)·x and add to 180.',{unit:'°'});}
function genScaleMap(){const sc=pick([2,3,4,5,0.5,1.5,2.5]),inch=pick([2,3,4,5,6,1.5,2.5,3.5]),ans=sc*inch*10;

function genSimPoly(){const t=pick(['side','scale','perim']);const k=pick([new Q(2),new Q(3),new Q(3,2),new Q(5,2),new Q(1,2),new Q(4,3),new Q(2,3)]);

  if(t==='scale')return num(`ABCD ~ EFGH with AB = ${a} and EF = ${fm(A2)}. What is the scale factor from ABCD to EFGH?`,k.val(),[`Scale factor = ${fracH('new','original')} = ${fracH('EF','AB')} = ${fracH(fm(A2),a)} = <b>${k.html()}</b>`],'Divide a side of the new figure by the matching side of the original.',{visual:vis,inputHint:'e.g. 3/2',finalH:k.html()});

function genSimTest(){const t=pick(['AA','SSS','SAS','none']);let q,st;
  if(t==='AA'){const a=ri(30,80),b=ri(30,80);q=`ΔABC has m∠A = ${a}° and m∠B = ${b}°. ΔDEF has m∠D = ${a}° and m∠F = ${180-a-b}°.`;st=[`m∠C = 180 ${MINUS} ${a} ${MINUS} ${b} = ${180-a-b}°.`,`So ∠A ≅ ∠D and ∠C ≅ ∠F — two pairs of congruent angles → <b>AA Similarity</b>.`];}
  else if(t==='SSS'){const s=[ri(3,9),ri(3,9),ri(3,9)].sort((a,b)=>a-b);const k=pick([2,3,1.5]);if(s[0]+s[1]<=s[2])return genSimTest();q=`ΔABC has sides ${s.join(', ')}. ΔDEF has sides ${s.map(v=>fm(v*k)).join(', ')}.`;st=[`Compare matching sides (smallest to smallest…): ${s.map(v=>`${fm(v*k)}/${v}`).join(', ')} — all equal ${k}.`,`All three ratios match → <b>SSS Similarity</b>.`];}
  else if(t==='SAS'){const a=ri(3,9),b=ri(3,9),k=pick([2,3,4]),A=ri(30,110);q=`In ΔABC, AB = ${a}, AC = ${b}, and m∠A = ${A}°. In ΔDEF, DE = ${a*k}, DF = ${b*k}, and m∠D = ${A}°.`;st=[`${fracH('DE','AB')} = ${fracH(a*k,a)} = ${k} and ${fracH('DF','AC')} = ${fracH(b*k,b)} = ${k} — proportional.`,`The included angles ∠A and ∠D are congruent → <b>SAS Similarity</b>.`];}
  else{const a=ri(3,9),b=ri(3,9),A=ri(30,110);q=`In ΔABC, AB = ${a}, AC = ${b}, and m∠A = ${A}°. In ΔDEF, DE = ${a*2}, DF = ${b*3}, and m∠D = ${A}°.`;st=[`${fracH('DE','AB')} = 2 but ${fracH('DF','AC')} = 3 — not proportional.`,`So the triangles are <b>not similar</b> (by this information).`];}

  if(t==='height'){const d=ri(20,120),A=ri(15,70);ans=d*tanD(A);prompt=`From a point ${d} ft from the base of a tree, the angle of elevation to the top is ${A}°. How tall is the tree?${RND1}`;st=[`Draw a right triangle: ground = adjacent (${d}), tree = opposite (h).`,`tan ${A}° = ${fracH('h',d)} → h = ${d} · tan ${A}° ≈ <b>${r1(ans)} ft</b>`];vis=rtFig(d,ans,{a:d+' ft',b:'h',angB:A+'°'});}

  else if(t==='angle'){const h=ri(10,80),d=ri(20,120);ans=deg(Math.atan(h/d));prompt=`A ramp rises ${h} ft over a horizontal distance of ${d} ft. Find its angle of elevation to the nearest degree.`;st=[`tan θ = ${fracH('opposite','adjacent')} = ${fracH(h,d)}`,`θ = tan⁻¹(${h}/${d}) ≈ <b>${Math.round(ans)}°</b>`];ans=Math.round(ans);vis=rtFig(d,h,{a:d+' ft',b:h+' ft',angB:'θ'});}

  return num(prompt,t==='angle'?ans:r1(ans),st,'Sketch it! The height is opposite the angle at ground level; the ground distance is adjacent.',{tol:t==='angle'?0.6:T1+0.05,visual:vis});}
function genLawSines(){let A,B;do{A=ri(30,100);B=ri(25,100);}while(A+B>160);const Cc=180-A-B;const a=ri(5,25);const b=a*sinD(B)/sinD(A);
  const P=triAng(A,B,Cc);
  return num(`In ΔABC, m∠A = ${A}°, m∠B = ${B}°, and a = ${a}. Find b.${RND1}`,r1(b),[`Two angles and a side → Law of Sines: ${fracH('sin A','a')} = ${fracH('sin B','b')}`,`${fracH('sin '+A+'°',a)} = ${fracH('sin '+B+'°','b')}`,`b = ${a} · sin ${B}° ÷ sin ${A}° ≈ <b>${r1(b)}</b>`],'Law of Sines pairs each angle with the side across from it.',{tol:T1+0.05,visual:fig({pts:P,polys:[{p:['A','B','C']}],angs:[{at:'A',a:'B',b:'C',label:A+'°'},{at:'B',a:'A',b:'C',label:B+'°',color:B_COL}],sl:[['B','C','a = '+a],['A','C','b = ?',B_COL]],h:240})});}
function genLawCos(){const t=pick(['side','angle']);
  if(t==='side'){const b=ri(4,20),c=ri(4,20),A=ri(25,140);const a=Math.sqrt(b*b+c*c-2*b*c*cosD(A));const P=triPts(a,b,c);
    return num(`In ΔABC, b = ${b}, c = ${c}, and m∠A = ${A}°. Find a.${RND1}`,r1(a),[`Two sides and the included angle → Law of Cosines: a² = b² + c² ${MINUS} 2bc·cos A`,`a² = ${b*b} + ${c*c} ${MINUS} 2(${b})(${c})cos ${A}° ≈ ${r2(a*a)}`,`a ≈ <b>${r1(a)}</b>`],'SAS → Law of Cosines.',{tol:T1+0.05,visual:fig({pts:P,polys:[{p:['A','B','C']}],angs:[{at:'A',a:'B',b:'C',label:A+'°'}],sl:[['A','B','c = '+c],['A','C','b = '+b],['B','C','a = ?',B_COL]],h:240})});}
  let a,b,c;do{a=ri(4,20);b=ri(4,20);c=ri(4,20);}while(a+b<=c||a+c<=b||b+c<=a);const Cang=deg(Math.acos((a*a+b*b-c*c)/(2*a*b)));const P=triPts(a,b,c);
  return num(`In ΔABC, a = ${a}, b = ${b}, and c = ${c}. Find m∠C to the nearest degree.`,Math.round(Cang),[`Three sides → Law of Cosines: c² = a² + b² ${MINUS} 2ab·cos C`,`cos C = ${fracH(`${a}² + ${b}² ${MINUS} ${c}²`,`2(${a})(${b})`)} = ${fracH(a*a+b*b-c*c,2*a*b)}`,`C = cos⁻¹(…) ≈ <b>${Math.round(Cang)}°</b>`],'SSS → Law of Cosines, solved for the angle.',{tol:0.6,unit:'°',visual:fig({pts:P,polys:[{p:['A','B','C']}],angs:[{at:'C',a:'A',b:'B',label:'?'}],sl:[['B','C',a],['A','C',b],['A','B',c]],h:240})});}

const onC=(t,r=3)=>[r*cosD(t),r*sinD(t)];
function circFig(o){const r=o.r||3;const pts={O:[0,0]};for(const k in o.at)pts[k]=onC(o.at[k],r);Object.assign(pts,o.extra||{});

function genCircum(){const t=pick(['c_r','c_d','r_c','area?']);const r=ri(2,15);
  if(t==='c_r')return num(`Find the circumference of a circle with radius ${r}.${PIN}`,2*Math.PI*r,[`C = 2πr`,`C = 2π(${r}) = <b>${2*r}π ≈ ${(2*Math.PI*r).toFixed(1)}</b>`],'C = 2πr (or πd).',{tol:T1,visual:circFig({at:{A:20},f:{segs:[['O','A',{color:A_COL}]],sl:[['O','A',r,A_COL]]},nolab:['A']}),finalH:`${2*r}π`});
  if(t==='c_d'){const d=2*r;return num(`Find the circumference of a circle with diameter ${d}.${PIN}`,Math.PI*d,[`C = πd`,`C = π(${d}) = <b>${d}π ≈ ${(Math.PI*d).toFixed(1)}</b>`],'C = πd.',{tol:T1,finalH:`${d}π`});}
  const C2=2*r;return num(`A circle has circumference ${C2}π. Find its radius.`,r,[`C = 2πr → ${C2}π = 2πr`,`Divide both sides by 2π: <b>r = ${r}</b>`],'Set up C = 2πr and solve for r.');}

  {q:'A segment from the center to a point on the circle is a…',c:['radius','diameter','chord','secant'],s:['That is the definition of a <b>radius</b>.'],h:'"Radi-" like rays from the center.'},
  {q:'A chord that passes through the center is a…',c:['diameter','radius','tangent','secant'],s:['A <b>diameter</b> is a chord through the center (the longest chord).'],h:'It goes all the way across through the middle.'},
  {q:'A segment with both endpoints on the circle is a…',c:['chord','radius','tangent','arc'],s:['That is a <b>chord</b>.'],h:'Like a guitar chord stretched across.'},

])();}
function genArc(){const t=pick(['central','major','alg','len']);
  if(t==='central'){const a=ri(20,170);return num(`∠AOB is a central angle measuring ${a}°. Find the measure of minor arc AB.`,a,[`A minor arc has the <b>same measure</b> as its central angle.`,`m(arc AB) = <b>${a}°</b>`],'Central angle = its arc.',{unit:'°',visual:circFig({at:{A:0,B:a},f:{segs:[['O','A'],['O','B']],arcs:[{c:'O',from:'A',to:'B'}],angs:[{at:'O',a:'A',b:'B',label:a+'°'}]}})});}
  if(t==='major'){const a=ri(20,170);return num(`Minor arc AB measures ${a}°. Find the measure of major arc ACB.`,360-a,[`A whole circle is 360°.`,`Major arc = 360° ${MINUS} ${a}° = <b>${360-a}°</b>`],'Major arc = 360° − minor arc.',{unit:'°',visual:circFig({at:{A:0,B:a,C:a+(360-a)/2},f:{segs:[['O','A'],['O','B']],arcs:[{c:'O',from:'B',to:'A',color:B_COL}]}})});}
  if(t==='alg'){let x,p,q,r,s,a1,a2,a3;do{x=ri(5,30);p=ri(1,5);q=ri(-10,30);r=ri(1,5);s=ri(-10,30);a1=p*x+q;a2=r*x+s;a3=360-a1-a2;}while(a1<30||a2<30||a3<30);
    return num(`Three central angles divide a circle. Their measures are (${ex(p,q)})°, (${ex(r,s)})°, and ${a3}°. Find x.`,x,[`The central angles around a point add to <b>360°</b>.`,`(${ex(p,q)}) + (${ex(r,s)}) + ${a3} = 360`,`${ex(p+r,q+s+a3)} = 360 → ${p+r}x = ${360-q-s-a3} → <b>x = ${x}</b>`],'All the central angles of a circle add to 360°.',{visual:circFig({at:{A:90,B:90+a1,C:90+a1+a2},f:{segs:[['O','A'],['O','B'],['O','C']]}})});}
  const r=ri(2,12),a=pick([30,45,60,72,90,120,135,150,40,80,100]);const L0=a/360*2*Math.PI*r;const q=new Q(a*2*r,360);
  return num(`In a circle with radius ${r}, find the length of an arc with measure ${a}°.${PIN}`,L0,[`Arc length = ${fracH('arc measure','360°')} · 2πr`,`= ${fracH(a,360)} · 2π(${r}) = ${q.html()}π`,`≈ <b>${L0.toFixed(1)}</b>`],'Arc length is a fraction of the circumference: (degrees/360) · 2πr.',{tol:T1,finalH:q.html()+'π',visual:circFig({at:{A:0,B:a},f:{segs:[['O','A'],['O','B']],arcs:[{c:'O',from:'A',to:'B'}],sl:[['O','A',r]],angs:[{at:'O',a:'A',b:'B',label:a+'°',r:18}]},nolab:['A','B']})});}
function genChord(){const t=pick(['half','dist','alg']);
  if(t==='half'){const T=pick([[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15]]);const [d,h,r]=T;
    return num(`A circle has radius ${r}. A chord is ${d} units from the center. How long is the chord?`,2*h,[`A segment from the center perpendicular to a chord <b>bisects</b> the chord.`,`Right triangle: radius ${r} is the hypotenuse, distance ${d} is a leg. Half-chord = √(${r}² ${MINUS} ${d}²) = √${r*r-d*d} = ${h}`,`Whole chord = 2 · ${h} = <b>${2*h}</b>`],'Draw the radius to an endpoint of the chord — it makes a right triangle.',{visual:fig({pts:{O:[0,0],M:[0,-d],A:[-h,-d],B:[h,-d]},circles:[{c:'O',r}],segs:[['A','B',{color:A_COL}],['O','M',{color:C_COL}],['O','B',{dash:true}]],rights:[['O','M','B']],sl:[['O','M',d,C_COL],['O','B',r]],nolab:['M'],h:250})});}
  if(t==='dist'){const T=pick([[3,4,5],[5,12,13],[6,8,10],[8,15,17]]);const [d,h,r]=T;
    return num(`A circle has radius ${r}. A chord has length ${2*h}. How far is the chord from the center?`,d,[`The perpendicular from the center bisects the chord, so half-chord = ${h}.`,`d = √(${r}² ${MINUS} ${h}²) = √${r*r-h*h} = <b>${d}</b>`],'Half the chord, the distance, and the radius form a right triangle.');}
  let x,p,q,r2_,s,v;do{x=ri(2,10);p=ri(2,6);r2_=ri(1,5);}while(p===r2_);q=ri(-5,10);s=(p-r2_)*x+q;v=p*x+q;if(v<3)return genChord();
  return num(`In a circle, chords AB and CD are each ${ri(3,9)} units from the center. AB = ${ex(p,q)} and CD = ${ex(r2_,s)}. Find x.`,x,[`Chords that are equidistant from the center are <b>congruent</b>.`,`${ex(p,q)} = ${ex(r2_,s)} → <b>x = ${x}</b>`],'Same distance from the center → same length.');}
function genInscribed(){const t=pick(['angle','arc','semi','quad','same']);
  if(t==='angle'){const a=2*ri(15,85);return num(`Inscribed angle ∠ABC intercepts arc AC, which measures ${a}°. Find m∠ABC.`,a/2,[`Inscribed Angle Theorem: an inscribed angle is <b>half</b> its intercepted arc.`,`${a}° ÷ 2 = <b>${a/2}°</b>`],'Inscribed angle = ½ arc.',{unit:'°',visual:circFig({at:{A:-40,C:-40+a,B:-40+a+(360-a)/2},f:{segs:[['B','A'],['B','C']],arcs:[{c:'O',from:'A',to:'C'}]},nolab:['O'],dots:['A','B','C']})});}
  if(t==='arc'){const g=ri(15,85);return num(`Inscribed angle ∠ABC measures ${g}°. Find the measure of its intercepted arc AC.`,2*g,[`The arc is <b>twice</b> the inscribed angle.`,`2 · ${g}° = <b>${2*g}°</b>`],'Arc = 2 × inscribed angle.',{unit:'°'});}
  if(t==='semi'){const a=ri(20,70);return num(`<span style="text-decoration:overline">AC</span> is a diameter and B is on the circle. If m∠BAC = ${a}°, find m∠BCA.`,90-a,[`An inscribed angle that intercepts a semicircle is a <b>right angle</b>: m∠ABC = 90°.`,`m∠BCA = 180 ${MINUS} 90 ${MINUS} ${a} = <b>${90-a}°</b>`],'An angle inscribed in a semicircle is 90°.',{unit:'°',visual:circFig({at:{A:180,C:0,B:180-2*a},f:{polys:[{p:['A','B','C']}],rights:[['A','B','C']]},dots:['A','B','C']})});}
  if(t==='quad'){const a=ri(50,130);return num(`Quadrilateral ABCD is inscribed in a circle. m∠A = ${a}°. Find m∠C.`,180-a,[`Opposite angles of an inscribed quadrilateral are <b>supplementary</b>.`,`m∠C = 180 ${MINUS} ${a} = <b>${180-a}°</b>`],'Opposite angles of an inscribed quadrilateral add to 180°.',{unit:'°',visual:circFig({at:{A:200,B:120,C:20,D:290},f:{polys:[{p:['A','B','C','D']}]},nolab:['O'],dots:['A','B','C','D']})});}
  const g=ri(20,70);return num(`∠ADB and ∠ACB are inscribed angles that both intercept arc AB. If m∠ADB = ${g}°, find m∠ACB.`,g,[`Inscribed angles that intercept the <b>same arc</b> are congruent.`,`m∠ACB = <b>${g}°</b>`],'Same arc → same inscribed angle.',{unit:'°'});}
function genTangent(){const t=pick(['len','rad','two','perim']);
  if(t==='len'||t==='rad'){const T=pick(TRIPLES.slice(0,5));const [r,L0,d]=T;
    if(t==='len')return num(`<span style="text-decoration:overline">AB</span> is tangent to circle O at B. OB = ${r} and OA = ${d}. Find AB.`,L0,[`A tangent is <b>perpendicular</b> to the radius at the point of tangency, so ∠OBA = 90°.`,`AB² + ${r}² = ${d}² → AB² = ${d*d-r*r} → <b>AB = ${L0}</b>`],'Tangent ⟂ radius → right triangle → Pythagorean Theorem.',{visual:fig({pts:{O:[0,0],B:[0,r],A:[L0,r]},circles:[{c:'O',r}],segs:[['O','B'],['B','A',{color:A_COL,ext:0}],['O','A',{dash:true}]],rights:[['O','B','A']],sl:[['O','B',r],['O','A',d]],h:240})});
    return num(`<span style="text-decoration:overline">AB</span> is tangent to circle O at B. AB = ${L0} and OA = ${d}. Find the radius.`,r,[`Tangent ⟂ radius, so ΔOBA is a right triangle with hypotenuse OA.`,`r² + ${L0}² = ${d}² → r² = ${d*d-L0*L0} → <b>r = ${r}</b>`],'OA is the hypotenuse.');}

function genSecAngle(){const t=pick(['in','out','on']);

const circEq=(h,k,r2)=>`(x ${h<0?'+ '+(-h):h?MINUS+' '+h:''})² + (y ${k<0?'+ '+(-k):k?MINUS+' '+k:''})² = ${r2}`.replace('(x )','x').replace('(y )','y');

  const D=-2*h,E=-2*k,F=h*h+k*k-r*r;const eq=`x² + y² ${D<0?MINUS+' '+(-D)+'x':D?'+ '+D+'x':''} ${E<0?MINUS+' '+(-E)+'y':E?'+ '+E+'y':''} ${F<0?MINUS+' '+(-F):F?'+ '+F:''} = 0`.replace(/\s+/g,' ');

function regPoly(n,r=3,rot=90){const P={};for(let i=0;i<n;i++)P['P'+i]=onC(rot+i*360/n,r);return P;}
function genPolyAngles(){const n=pick([5,6,8,9,10,12,15,18,20]);const t=pick(['sum','each','ext','findn','findn2']);
  if(t==='sum')return num(`Find the sum of the interior angles of a convex ${PNAME[n]||n+'-gon'}.`,(n-2)*180,[`Interior angle sum = (n ${MINUS} 2) · 180°`,`(${n} ${MINUS} 2) · 180 = ${n-2} · 180 = <b>${(n-2)*180}°</b>`],'A polygon with n sides can be split into n − 2 triangles.',{unit:'°',visual:n<=12?fig({pts:regPoly(n),polys:[{p:Object.keys(regPoly(n))}],nolab:Object.keys(regPoly(n)),dots:[],h:200}):''});
  if(t==='each')return num(`Find the measure of each interior angle of a regular ${PNAME[n]||n+'-gon'}.`,(n-2)*180/n,[`Sum = (${n} ${MINUS} 2) · 180 = ${(n-2)*180}°`,`Regular → all angles equal: ${(n-2)*180} ÷ ${n} = <b>${fm((n-2)*180/n)}°</b>`],'Find the sum, then divide by the number of angles.',{unit:'°'});
  if(t==='ext')return num(`Find the measure of each exterior angle of a regular ${PNAME[n]||n+'-gon'}.`,360/n,[`The exterior angles of any convex polygon add to <b>360°</b>.`,`360 ÷ ${n} = <b>${fm(360/n)}°</b>`],'Exterior angles always total 360°.',{unit:'°'});
  if(t==='findn')return num(`Each interior angle of a regular polygon measures ${fm((n-2)*180/n)}°. How many sides does it have?`,n,[`Each exterior angle = 180 ${MINUS} ${fm((n-2)*180/n)} = ${fm(360/n)}°`,`n = 360 ÷ ${fm(360/n)} = <b>${n}</b>`],'Use the exterior angle: 180 − interior, then 360 ÷ exterior.');
  return num(`The interior angles of a convex polygon add to ${(n-2)*180}°. How many sides does it have?`,n,[`(n ${MINUS} 2) · 180 = ${(n-2)*180}`,`n ${MINUS} 2 = ${n-2} → <b>n = ${n}</b>`],'Divide by 180, then add 2.');}

  const sl=(P,Q2)=>new Q(Q2[1]-P[1],Q2[0]-P[0]);const ab=sl(A,B),dc=sl(Dd,Cc),ad=sl(A,Dd),bc=sl(B,Cc);const ok=ab.eq(dc)&&ad.eq(bc);

  if(t==='pg')return num(`A parallelogram has base ${b} and height ${h}. Find its area.`,b*h,[`A = bh`,`A = ${b} · ${h} = <b>${b*h}</b> square units`],'Area of a parallelogram = base × height (the height is perpendicular to the base, not the slanted side).',{visual:fig({pts:{A:[0,0],B:[b,0],C:[b+h*.5,h],D:[h*.5,h],H:[h*.5,0]},polys:[{p:['A','B','C','D']}],segs:[['D','H',{dash:true,color:C_COL}]],rights:[['A','H','D']],sl:[['A','B',b],['D','H',h,C_COL]],nolab:['A','B','C','D','H'],dots:[],h:200})});
  if(t==='tri')return num(`A triangle has base ${b} and height ${h}. Find its area.`,b*h/2,[`A = ½bh`,`A = ½ · ${b} · ${h} = <b>${fm(b*h/2)}</b> square units`],'A triangle is half a parallelogram.',{visual:fig({pts:{A:[0,0],B:[b,0],C:[b*.35,h],H:[b*.35,0]},polys:[{p:['A','B','C']}],segs:[['C','H',{dash:true,color:C_COL}]],rights:[['A','H','C']],sl:[['A','B',b],['C','H',h,C_COL]],nolab:['A','B','C','H'],dots:[],h:200})});
  const A0=b*h;return num(`A parallelogram has area ${A0} and base ${b}. Find its height.`,h,[`A = bh → ${A0} = ${b}h`,`h = ${A0} ÷ ${b} = <b>${h}</b>`],'Divide the area by the base.');}
function genRect(){const t=pick(['diag','half','ang']);
  if(t==='diag'){let x,p,q,r,s,v;do{x=ri(2,12);p=ri(2,6);r=ri(1,5);}while(p===r);q=ri(-5,12);s=(p-r)*x+q;v=p*x+q;if(v<3)return genRect();
    return num(`ABCD is a rectangle. AC = ${ex(p,q)} and BD = ${ex(r,s)}. Find AC.`,v,[`The diagonals of a rectangle are <b>congruent</b>.`,`${ex(p,q)} = ${ex(r,s)} → x = ${x}`,`AC = <b>${v}</b>`],'Rectangle diagonals are equal in length.',{visual:fig({pts:{A:[0,0],B:[6,0],C:[6,3.5],D:[0,3.5]},polys:[{p:['A','B','C','D']}],segs:[['A','C',{color:A_COL}],['B','D',{color:B_COL}]],rights:[['D','A','B']]})});}
  if(t==='half'){const v=ri(3,15);return num(`ABCD is a rectangle with diagonals meeting at E. AE = ${v}. Find BD.`,2*v,[`Rectangle diagonals are congruent <b>and</b> bisect each other, so all four half-diagonals are equal.`,`AC = 2 · ${v} = ${2*v}, and BD = AC = <b>${2*v}</b>`],'All four pieces of the diagonals are equal in a rectangle.',{visual:fig({pts:{A:[0,0],B:[6,0],C:[6,3.5],D:[0,3.5],E:[3,1.75]},polys:[{p:['A','B','C','D']}],segs:[['A','C'],['B','D']],sl:[['A','E',v,A_COL]]})});}
  const a=ri(20,70);return num(`ABCD is a rectangle. Diagonal AC makes m∠BAC = ${a}°. Find m∠CAD.`,90-a,[`Each angle of a rectangle is 90°.`,`m∠CAD = 90 ${MINUS} ${a} = <b>${90-a}°</b>`],'∠BAC and ∠CAD together make the 90° corner at A.',{unit:'°'});}
function genRhombus(){const t=pick(['perp','bis','alg','side']);
  if(t==='perp'){const a=ri(20,70);return num(`ABCD is a rhombus with diagonals meeting at E. m∠ABE = ${a}°. Find m∠BAE.`,90-a,[`The diagonals of a rhombus are <b>perpendicular</b>, so m∠AEB = 90°.`,`m∠BAE = 180 ${MINUS} 90 ${MINUS} ${a} = <b>${90-a}°</b>`],'Rhombus diagonals meet at right angles.',{unit:'°',visual:fig({pts:{A:[-3,0],B:[0,2],C:[3,0],D:[0,-2],E:[0,0]},polys:[{p:['A','B','C','D']}],segs:[['A','C'],['B','D']],rights:[['A','E','B']],ticks:[['A','B',1],['B','C',1],['C','D',1],['D','A',1]],lpos:{E:[10,12]}})});}
  if(t==='bis'){const a=ri(20,70);return num(`ABCD is a rhombus. m∠BAC = ${a}°. Find m∠BAD.`,2*a,[`Each diagonal of a rhombus <b>bisects</b> a pair of opposite angles.`,`m∠BAD = 2 · ${a} = <b>${2*a}°</b>`],'The diagonal cuts the angle at A in half.',{unit:'°'});}
  if(t==='alg'){let x,p,q;do{x=ri(3,15);p=ri(2,7);q=90-p*x;}while(Math.abs(q)>40);return num(`ABCD is a rhombus with diagonals meeting at E. m∠AEB = (${ex(p,q)})°. Find x.`,x,[`Rhombus diagonals are perpendicular: m∠AEB = 90°.`,`${ex(p,q)} = 90 → <b>x = ${x}</b>`],'What angle do rhombus diagonals make?');}
  const T=pick([[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17]]);return num(`A rhombus has diagonals of length ${2*T[0]} and ${2*T[1]}. Find the length of each side.`,T[2],[`Diagonals bisect each other at right angles, making 4 right triangles with legs ${T[0]} and ${T[1]}.`,`side = √(${T[0]}² + ${T[1]}²) = √${T[2]**2} = <b>${T[2]}</b>`],'Half of each diagonal are the legs of a right triangle.');}
function genQuadClass(){return bank([
  {q:'A square is <b>always</b>, <b>sometimes</b>, or <b>never</b> a rhombus?',c:['always','sometimes','never'],s:['A square has 4 congruent sides, so it is always a rhombus.'],h:'Rhombus = 4 congruent sides.'},
  {q:'A rhombus is ___ a square.',c:['sometimes','always','never'],s:['A rhombus is a square only if it has right angles.'],h:'Does a rhombus need right angles?'},
  {q:'A rectangle is ___ a parallelogram.',c:['always','sometimes','never'],s:['Rectangles have two pairs of parallel sides.'],h:'Check the definition of a parallelogram.'},
  {q:'A trapezoid is ___ a parallelogram.',c:['never','sometimes','always'],s:['A trapezoid has exactly one pair of parallel sides.'],h:'How many pairs of parallel sides does a trapezoid have?'},
  {q:'A parallelogram is ___ a rectangle.',c:['sometimes','always','never'],s:['Only when its angles are right angles.'],h:'Does every parallelogram have right angles?'},
  {q:'The diagonals of a rectangle are ___ perpendicular.',c:['sometimes','always','never'],s:['Only if the rectangle is a square.'],h:'Draw a long thin rectangle.'},
  {q:'The diagonals of a rhombus are ___ perpendicular.',c:['always','sometimes','never'],s:['Rhombus diagonals are always perpendicular.'],h:'A key rhombus property.'},
  {q:'The diagonals of a square are ___ congruent.',c:['always','sometimes','never'],s:['A square is a rectangle, and rectangle diagonals are congruent.'],h:'A square is also a rectangle.'}
])();}
function genTrapKite(){const t=pick(['mid','base','iso','kite']);
  if(t==='mid'){const b1=ri(4,20),b2=ri(4,20);if((b1+b2)%2)return genTrapKite();return num(`A trapezoid has bases ${b1} and ${b2}. Find the length of its midsegment.`,(b1+b2)/2,[`Trapezoid Midsegment Theorem: midsegment = ½(base₁ + base₂)`,`½(${b1} + ${b2}) = <b>${(b1+b2)/2}</b>`],'The midsegment is the average of the two bases.',{visual:fig({pts:{A:[0,0],B:[8,0],C:[6,3],D:[2,3],M:[1,1.5],N:[7,1.5]},polys:[{p:['A','B','C','D']}],segs:[['M','N',{color:C_COL,dash:true}]],sl:[['A','B',b1],['D','C',b2]],nolab:['M','N']})});}
  if(t==='base'){const m=ri(6,20),b1=ri(2,2*m-2);const b2=2*m-b1;return num(`A trapezoid has a midsegment of ${m} and one base of ${b1}. Find the other base.`,b2,[`${m} = ½(${b1} + b) → ${2*m} = ${b1} + b`,`b = <b>${b2}</b>`],'Midsegment × 2 = sum of the bases.');}
  if(t==='iso'){const a=ri(40,85);return num(`ABCD is an isosceles trapezoid with bases AB and DC. m∠A = ${a}°. Find m∠D.`,180-a,[`Base angles of an isosceles trapezoid are congruent, and ∠A and ∠D are consecutive angles between parallel bases.`,`∠A and ∠D are supplementary: 180 ${MINUS} ${a} = <b>${180-a}°</b>`],'Angles on the same leg of a trapezoid add to 180°.',{unit:'°',visual:fig({pts:{A:[0,0],B:[8,0],C:[6,3],D:[2,3]},polys:[{p:['A','B','C','D']}],angs:[{at:'A',a:'B',b:'D',label:a+'°'},{at:'D',a:'A',b:'C',label:'?',color:B_COL}],ticks:[['A','D',1],['B','C',1]]})});}
  const a=ri(60,130),b=ri(40,100);if(a+b>=330||360-a-b<20)return genTrapKite();const c=(360-a-b);if(c%2)return genTrapKite();
  return num(`ABCD is a kite with AB ≅ AD and CB ≅ CD. m∠A = ${a}° and m∠C = ${b}°. Find m∠B.`,c/2,[`In a kite, the angles between the non-congruent sides (∠B and ∠D) are <b>congruent</b>.`,`m∠B + m∠D = 360 ${MINUS} ${a} ${MINUS} ${b} = ${c}`,`m∠B = ${c} ÷ 2 = <b>${c/2}°</b>`],'Quadrilateral angles add to 360°; the kite\'s two "side" angles are equal.',{unit:'°',visual:fig({pts:{A:[0,3],B:[-2.5,0.5],C:[0,-3],D:[2.5,0.5]},polys:[{p:['A','B','C','D']}],ticks:[['A','B',1],['A','D',1],['C','B',2],['C','D',2]]})});}
function genAreaTRK(){const t=pick(['trap','rhom','kite','trapH']);
  if(t==='trap'){const b1=ri(3,20),b2=ri(3,20),h=ri(2,14);return num(`A trapezoid has bases ${b1} and ${b2} and height ${h}. Find its area.`,h*(b1+b2)/2,[`A = ½h(b₁ + b₂)`,`A = ½ · ${h} · (${b1} + ${b2}) = ½ · ${h} · ${b1+b2} = <b>${fm(h*(b1+b2)/2)}</b>`],'Average the bases, then multiply by the height.');}
  if(t==='trapH'){let b1=ri(3,20),b2=ri(3,20),h=ri(2,14);const A0=h*(b1+b2)/2;if(!Number.isInteger(A0))return genAreaTRK();return num(`A trapezoid has area ${A0} and bases ${b1} and ${b2}. Find its height.`,h,[`${A0} = ½h(${b1} + ${b2}) = ${fm((b1+b2)/2)}h`,`h = ${A0} ÷ ${fm((b1+b2)/2)} = <b>${h}</b>`],'Plug into A = ½h(b₁ + b₂) and solve for h.');}
  const d1=ri(3,20),d2=ri(3,20);return num(`A ${t==='rhom'?'rhombus':'kite'} has diagonals ${d1} and ${d2}. Find its area.`,d1*d2/2,[`A = ½d₁d₂`,`A = ½ · ${d1} · ${d2} = <b>${fm(d1*d2/2)}</b>`],'Area of a rhombus or kite = half the product of the diagonals.');}
function genAreaCirc(){const t=pick(['area','sector','r','sectorPct']);const r=ri(2,15);
  if(t==='area')return num(`Find the area of a circle with radius ${r}.${PIN}`,Math.PI*r*r,[`A = πr²`,`A = π(${r})² = <b>${r*r}π ≈ ${(Math.PI*r*r).toFixed(1)}</b>`],'Square the radius, then multiply by π.',{tol:T1,finalH:`${r*r}π`});
  if(t==='r')return num(`A circle has area ${r*r}π. Find its radius.`,r,[`πr² = ${r*r}π → r² = ${r*r}`,`r = <b>${r}</b>`],'Divide by π, then square root.');
  const a=pick([30,45,60,72,90,120,135,150,40,80,100,200,270]);const q=new Q(a*r*r,360);
  return num(`Find the area of a sector with radius ${r} and central angle ${a}°.${PIN}`,a/360*Math.PI*r*r,[`Sector area = ${fracH('angle','360°')} · πr²`,`= ${fracH(a,360)} · π(${r})² = ${q.html()}π`,`≈ <b>${(a/360*Math.PI*r*r).toFixed(1)}</b>`],'A sector is a fraction of the whole circle.',{tol:T1,finalH:q.html()+'π',visual:circFig({at:{A:0,B:a},f:{polys:[],segs:[['O','A'],['O','B']],arcs:[{c:'O',from:'A',to:'B'}],angs:[{at:'O',a:'A',b:'B',label:a+'°',fill:true}]},nolab:['A','B']})});}
function genRegArea(){const t=pick(['given','hex','sq']);
  if(t==='given'){const n=pick([5,6,8,10]),s=ri(3,14),a=r1(s/(2*tanD(180/n)));const A0=0.5*n*s*a;return num(`A regular ${PNAME[n]} has side length ${s} and apothem ${a}. Find its area.${RND1}`,r1(A0),[`Perimeter P = ${n} · ${s} = ${n*s}`,`A = ½ · P · a = ½ · ${n*s} · ${a} ≈ <b>${r1(A0)}</b>`],'A = ½ × perimeter × apothem.',{tol:T1+0.05,visual:fig({pts:{...regPoly(n),O:[0,0],M:[3*cosD(90+180/n)*cosD(180/n),3*sinD(90+180/n)*cosD(180/n)]},polys:[{p:Object.keys(regPoly(n))}],segs:[['O','M',{color:C_COL}]],nolab:[...Object.keys(regPoly(n)),'M'],dots:['O'],h:220})});}
  if(t==='hex'){const s=2*ri(2,8);const a=s*Math.sqrt(3)/2;const A0=0.5*6*s*a;return num(`Find the area of a regular hexagon with side length ${s}.${RADN}`,A0,[`A regular hexagon is made of 6 equilateral triangles. The apothem is the height of one: a = ${s/2}√3.`,`P = 6 · ${s} = ${6*s}`,`A = ½ · ${6*s} · ${s/2}√3 = <b>${1.5*s*s}√3 ≈ ${A0.toFixed(1)}</b>`],'The apothem of a hexagon uses a 30-60-90 triangle: a = (s/2)√3.',{tol:T1,finalH:`${1.5*s*s}√3`});}
  const L0=ri(4,14),W=ri(3,10),r=W/2;const A0=L0*W+0.5*Math.PI*r*r;return num(`A window is a ${L0} by ${W} rectangle with a semicircle on top (the semicircle's diameter is the ${W}-unit side). Find the total area.${RND1}`,r1(A0),[`Rectangle: ${L0} · ${W} = ${L0*W}`,`Semicircle: radius ${fm(r)}, area = ½ · π · ${fm(r)}² ≈ ${(0.5*Math.PI*r*r).toFixed(1)}`,`Total ≈ <b>${r1(A0)}</b>`],'Split the shape into pieces you know, find each area, and add.',{tol:T1+0.05});}
function genSimArea(){const t=pick(['area','k','side']);const k=pick([2,3,4,new Q(1,2),new Q(3,2),new Q(2,3),new Q(5,2)].map(Q.of));const A1=ri(2,12)*k.d*k.d;const A2=k.mul(k).mul(A1).val();
  if(t==='area')return num(`Two similar figures have a scale factor of ${k.html()}. The area of the first figure is ${A1}. Find the area of the second figure.`,A2,[`If the scale factor is k, the ratio of areas is <b>k²</b>.`,`k² = (${k.html()})² = ${k.mul(k).html()}`,`${A1} · ${k.mul(k).html()} = <b>${fm(A2)}</b>`],'Areas scale by the square of the scale factor.');
  if(t==='k')return num(`Two similar triangles have areas ${A1} and ${fm(A2)}. What is the scale factor (second : first)?`,k.val(),[`Area ratio = ${fracH(fm(A2),A1)} = ${k.mul(k).html()}`,`Scale factor = √(area ratio) = <b>${k.html()}</b>`],'Take the square root of the area ratio.',{inputHint:'e.g. 3/2',finalH:k.html()});
  return num(`Two similar polygons have areas ${A1} and ${fm(A2)}. Find the ratio of their perimeters (second : first).`,k.val(),[`Perimeters scale like sides (k), areas scale by k².`,`k = √(${fm(A2)}/${A1}) = <b>${k.html()}</b>`],'Perimeter ratio = scale factor = √(area ratio).',{inputHint:'e.g. 3/2',finalH:k.html()});}

function genSApyr(){const t=pick(['pyr','pyrH','cone','coneH']);
  if(t==='pyr'){const s0=ri(2,12),l=ri(3,15);const S=s0*s0+2*s0*l;return num(`A square pyramid has base edge ${s0} and slant height ${l}. Find its surface area.`,S,[`SA = B + ½Pℓ`,`B = ${s0}² = ${s0*s0}; P = 4 · ${s0} = ${4*s0}`,`SA = ${s0*s0} + ½ · ${4*s0} · ${l} = ${s0*s0} + ${2*s0*l} = <b>${S}</b>`],'Base area + 4 triangles (½ · perimeter · slant height).',{visual:solid('pyr',{s:s0,l})});}

    return num(`A square pyramid has base edge ${s0} and height ${h}. Find its surface area.`,S,[`First find the slant height: it is the hypotenuse of a right triangle with legs h = ${h} and half the base = ${half}.`,`ℓ = √(${h}² + ${half}²) = ${l}`,`SA = ${s0}² + ½ · ${4*s0} · ${l} = ${s0*s0} + ${2*s0*l} = <b>${S}</b>`],'Height, half the base edge, and slant height make a right triangle.',{visual:solid('pyr',{s:s0,h})});}
  if(t==='cone'){const r=ri(2,10),l=r+ri(1,10);const S=r*r+r*l;return num(`A cone has radius ${r} and slant height ${l}. Find its surface area.${PIN}`,Math.PI*S,[`SA = πr² + πrℓ`,`= π(${r})² + π(${r})(${l}) = ${r*r}π + ${r*l}π = <b>${S}π ≈ ${(Math.PI*S).toFixed(1)}</b>`],'Base circle + lateral area πrℓ.',{tol:T1,finalH:`${S}π`,visual:solid('cone',{r,l})});}

function genVolPrism(){const t=pick(['rect','tri','cyl','cylH']);
