  else{const b=ri(-5,5);if(b===p[1])return genReflect();img=[p[0],2*b-p[1]];name=`the line y = ${fmtN(b)}`;rule=`distance to the line is ${Math.abs(p[1]-b)}, so go ${Math.abs(p[1]-b)} past it: y = ${fmtN(2*b-p[1])}, x stays ${fmtN(p[0])}`;lines=[{m:0,b,dash:true,color:C_COL}];}
  return multi(`Reflect P${pt2(p)} across <b>${name}</b>. What are the coordinates of P′?`,[['x =',img[0]],['y =',img[1]]],[REFL[t]?`Rule for reflecting across ${name}: ${rule}`:`Count the distance from P to the mirror line, then go the same distance on the other side: ${rule}.`,`P′ = <b>${pt2(img)}</b>`],'A reflection flips the point over the line — same distance on the other side.',{visual:grid({lines,points:[{x:p[0],y:p[1],label:'P',color:A_COL}]}),fw:70});}
function genTranslate(){const t=pick(['apply','find']);const p=[ri(-8,8),ri(-8,8)];let a,b;do{a=ri(-7,7);b=ri(-7,7);}while(!a&&!b||Math.abs(p[0]+a)>10||Math.abs(p[1]+b)>10);const q=[p[0]+a,p[1]+b];
  const vec=`(x, y) → (x ${a<0?MINUS+' '+(-a):'+ '+a}, y ${b<0?MINUS+' '+(-b):'+ '+b})`;
  if(t==='apply')return multi(`Translate P${pt2(p)} using the rule ${vec}. Find P′.`,[['x =',q[0]],['y =',q[1]]],[`Add ${fmtN(a)} to x: ${fmtN(p[0])} + ${par(a)} = ${fmtN(q[0])}`,`Add ${fmtN(b)} to y: ${fmtN(p[1])} + ${par(b)} = ${fmtN(q[1])}`,`P′ = <b>${pt2(q)}</b>`],'A translation slides every point the same amount.',{visual:grid({points:[{x:p[0],y:p[1],label:'P',color:A_COL}]}),fw:70});
  return multi(`A translation maps P${pt2(p)} to P′${pt2(q)}. Write the rule (x, y) → (x + a, y + b). Find a and b.`,[['a =',a],['b =',b]],[`a = ${fmtN(q[0])} ${MINUS} ${par(p[0])} = ${fmtN(a)}`,`b = ${fmtN(q[1])} ${MINUS} ${par(p[1])} = ${fmtN(b)}`,`Rule: <b>${vec}</b>`],'Subtract: image − original, for x and for y.',{visual:grid({points:[{x:p[0],y:p[1],label:'P',color:A_COL},{x:q[0],y:q[1],label:"P′",color:B_COL}],segs:[{x1:p[0],y1:p[1],x2:q[0],y2:q[1],dash:true}]}),fw:70});}
function genRotate(){const d=pick([90,180,270]);let p;do{p=[ri(-8,8),ri(-8,8)];}while(!p[0]||!p[1]);const q=ROT[d].f(p);
  return multi(`Rotate P${pt2(p)} <b>${d}° counterclockwise</b> about the origin. Find P′.`,[['x =',q[0]],['y =',q[1]]],[`Rule for ${d}° counterclockwise: ${ROT[d].r}`,`P′ = <b>${pt2(q)}</b>`,d===270?'(Same as 90° clockwise.)':''].filter(Boolean),'90°: (x, y) → (−y, x). 180°: (−x, −y). 270°: (y, −x).',{visual:grid({points:[{x:p[0],y:p[1],label:'P',color:A_COL}]}),fw:70});}
function genIdentify(){const t=pick(['reflection','translation','rotation']);const P=triPtsGrid();let I;
  if(t==='reflection'){const k=pick(['xaxis','yaxis']);I=P.map(REFL[k].f);}else if(t==='translation'){const a=pick([-7,-6,-5,5,6]),b=pick([-6,-5,4,-3,3]);I=P.map(([x,y])=>[x+a,y+b]);if(I.flat().some(v=>Math.abs(v)>10))return genIdentify();}else{I=P.map(ROT[pick([90,180,270])].f);}
  return mcFixed(`ΔABC (orange) is mapped to ΔA′B′C′ (green). Which congruence transformation is it?`,['Reflection','Translation','Rotation'],['reflection','translation','rotation'].indexOf(t),
    [`Translation: same orientation, just slid. Reflection: flipped (mirror image). Rotation: turned around a point.`,`A${pt2(P[0])} → A′${pt2(I[0])}, B${pt2(P[1])} → B′${pt2(I[1])}, C${pt2(P[2])} → C′${pt2(I[2])}`,`This is a <b>${t}</b>.`],'Is the image slid, flipped, or turned?',{visual:grid({segs:[...triSegs(P,A_COL),...triSegs(I,B_COL)],points:[{x:P[0][0],y:P[0][1],label:'A',color:A_COL},{x:I[0][0],y:I[0][1],label:"A′",color:B_COL}]})});}
function genDilate(){const t=pick(['apply','k','type']);const k=pick([2,3,new Q(1,2),new Q(3,2),new Q(1,3),4].map(Q.of));let p;do{p=[ri(-8,8)*k.d,ri(-8,8)*k.d];}while(!p[0]&&!p[1]||Math.abs(k.mul(p[0]).val())>10||Math.abs(k.mul(p[1]).val())>10||Math.abs(p[0])>10||Math.abs(p[1])>10);
  const q=[k.mul(p[0]).val(),k.mul(p[1]).val()];
  if(t==='apply')return multi(`Dilate P${pt2(p)} by a scale factor of ${k.html()} centered at the origin. Find P′.`,[['x =',q[0]],['y =',q[1]]],[`Dilation centered at the origin: (x, y) → (kx, ky)`,`(${k.html()} · ${par(p[0])}, ${k.html()} · ${par(p[1])}) = <b>${pt2(q)}</b>`],'Multiply both coordinates by the scale factor.',{fw:70,visual:grid({points:[{x:p[0],y:p[1],label:'P',color:A_COL}]})});
  if(t==='k')return num(`A dilation centered at the origin maps P${pt2(p)} to P′${pt2(q)}. Find the scale factor.`,k.val(),[`k = ${fracH("image coordinate","original coordinate")}`,`${p[0]?`${fm(q[0])} ÷ ${fmtN(p[0])}`:`${fm(q[1])} ÷ ${fmtN(p[1])}`} = <b>${k.html()}</b>`],'Divide an image coordinate by the matching original coordinate.',{inputHint:'e.g. 1/2',finalH:k.html()});
  const ans=k.val()>1?0:1;return mcFixed(`A dilation has scale factor ${k.html()}. Is it an enlargement or a reduction?`,['Enlargement','Reduction'],ans,[`k > 1 → enlargement; 0 < k < 1 → reduction.`,`${k.html()} ${k.val()>1?'> 1':'< 1'} → <b>${ans?'reduction':'enlargement'}</b>.`],'Compare the scale factor with 1.');}
function genSimTrans(){const P=triPtsGrid();const k=pick([2,3]);const I=P.map(([x,y])=>[x*k,y*k]);if(I.flat().some(v=>Math.abs(v)>10))return genSimTrans();
  return num(`ΔA′B′C′ is the image of ΔABC after a dilation centered at the origin. A${pt2(P[0])} maps to A′${pt2(I[0])}. What is the scale factor?`,k,[`Each coordinate is multiplied by k: ${fmtN(I[0][0])} ÷ ${fmtN(P[0][0])} = ${k}`,`Scale factor <b>${k}</b> — the triangles are similar, not congruent.`],'Divide an image coordinate by the original.',{visual:grid({segs:[...triSegs(P,A_COL),...triSegs(I,B_COL)]})});}
function genCompose(){const t=pick(['glide','par','int']);
  if(t==='glide'){let p;do{p=[ri(-7,7),ri(-7,7)];}while(!p[1]);const a=pick([-5,-4,-3,3,4,5]);const q=[p[0]+a,-p[1]];
    return multi(`Glide reflection: translate P${pt2(p)} by (x, y) → (x ${a<0?MINUS+' '+(-a):'+ '+a}, y), then reflect across the x-axis. Find the final image.`,[['x =',q[0]],['y =',q[1]]],[`Translate: ${pt2([p[0]+a,p[1]])}`,`Reflect across the x-axis (negate y): <b>${pt2(q)}</b>`],'Do the steps in order: slide first, then flip.',{fw:70});}
  if(t==='par'){const d=ri(2,9);return num(`A figure is reflected across line ℓ and then across line m. ℓ ∥ m and they are ${d} units apart. The result is a translation of how many units?`,2*d,[`Reflecting across two parallel lines = a <b>translation</b> of <b>twice</b> the distance between the lines.`,`2 · ${d} = <b>${2*d}</b> units`],'Two reflections in parallel lines make a slide of double the gap.');}
  const a=ri(15,85);return num(`A figure is reflected across two lines that intersect at a ${a}° angle. The result is a rotation of how many degrees?`,2*a,[`Reflecting across two intersecting lines = a <b>rotation</b> about the intersection point by <b>twice</b> the angle between the lines.`,`2 · ${a} = <b>${2*a}°</b>`],'Two reflections in intersecting lines make a turn of double the angle.',{unit:'°'});}
function genSymmetry(){const t=pick(['lines','order','mag','letters']);const n=pick([3,4,5,6,8,10,12]);const nm=PNAME[n]||n+'-gon';
  if(t==='lines')return num(`How many lines of symmetry does a regular ${nm} have?`,n,[`A regular polygon with n sides has <b>n</b> lines of symmetry.`,`Answer: <b>${n}</b>`],'Count lines through vertices and midpoints of sides.',{visual:fig({pts:regPoly(n),polys:[{p:Object.keys(regPoly(n))}],nolab:Object.keys(regPoly(n)),dots:[],h:200})});
  if(t==='order')return num(`What is the order of rotational symmetry of a regular ${nm}?`,n,[`A regular n-gon looks the same after n different rotations in one full turn.`,`Order = <b>${n}</b>`],'How many times does it match itself in one full turn?');
  if(t==='mag')return num(`What is the magnitude (smallest angle) of rotational symmetry of a regular ${nm}?`,360/n,[`Magnitude = 360° ÷ order = 360 ÷ ${n} = <b>${fm(360/n)}°</b>`],'Divide 360° by the number of sides.',{unit:'°'});
  return bank([{q:'Which letter has <b>both</b> a horizontal and a vertical line of symmetry?',c:['H','A','N','Z'],s:['H can be folded top-to-bottom and left-to-right.'],h:'Try folding each letter both ways.'},{q:'Which letter has rotational symmetry but <b>no</b> line symmetry?',c:['N','A','M','E'],s:['N looks the same after a 180° turn, but has no mirror line.'],h:'Turn it upside down.'},{q:'Which letter has only a vertical line of symmetry?',c:['A','B','S','Z'],s:['A can be folded left-right only.'],h:'Fold it left to right.'},{q:'Which letter has only a horizontal line of symmetry?',c:['B','A','H','N'],s:['B folds top-to-bottom.'],h:'Fold it top to bottom.'}])();}
UNITS.push({num:12,title:'Transformations',weeks:'2 weeks',intro:'Reflections, translations, rotations, compositions, symmetry, and dilations.',lessons:[
L('4.7','Congruence Transformations','Rigid motions keep size and shape.',[
  C('Three rigid motions',`<table class="t"><tr><th>Transformation</th><th>What it does</th></tr><tr><td><b>Reflection</b></td><td>Flip over a line (mirror image)</td></tr><tr><td><b>Translation</b></td><td>Slide every point the same distance and direction</td></tr><tr><td><b>Rotation</b></td><td>Turn around a fixed point</td></tr></table><div class="box key">These are <b>congruence transformations</b> (isometries): the image is congruent to the original.</div>`)
],[['Identify the transformation',genIdentify]]),
L('7.6','Similarity Transformations','Dilations make similar figures.',[
  C('Dilations & similarity',`<p>A <b>dilation</b> enlarges or reduces a figure by a scale factor k. The image is <b>similar</b> to the original (same shape, different size).</p><p>k > 1 → enlargement. 0 < k < 1 → reduction.</p>`,()=>grid({min:-1,max:9,segs:[...triSegs([[1,1],[3,1],[1,3]],A_COL),...triSegs([[2,2],[6,2],[2,6]],B_COL)]}))
],[['Find the scale factor',genSimTrans],['Dilations',genDilate]]),
L('9.1','Reflections','Reflect across the axes, y = x, y = −x, and other lines.',[
  C('Reflection rules',`<table class="t"><tr><th>Across</th><th>Rule</th></tr><tr><td>x-axis</td><td>(x, y) → (x, ${MINUS}y)</td></tr><tr><td>y-axis</td><td>(x, y) → (${MINUS}x, y)</td></tr><tr><td>y = x</td><td>(x, y) → (y, x)</td></tr><tr><td>y = ${MINUS}x</td><td>(x, y) → (${MINUS}y, ${MINUS}x)</td></tr></table><p>For other lines (like x = 2), count the distance to the line and go the same distance past it.</p>`,()=>grid({points:[{x:3,y:5,label:'P(3, 5)',color:A_COL},{x:3,y:-5,label:"P′(3, −5)",color:B_COL}],segs:[{x1:3,y1:5,x2:3,y2:-5,dash:true}]}))
],[['Reflect a point',genReflect]]),
L('9.2','Translations','Slide by a vector.',[
  C('Translation rule',`<p>A translation moves every point the same way: <b>(x, y) → (x + a, y + b)</b>.</p><p>Right/left changes x; up/down changes y.</p>`)
],[['Translations',genTranslate]]),
L('9.3','Rotations','Rotate 90°, 180°, 270° about the origin.',[
  C('Rotation rules (counterclockwise about the origin)',`<table class="t"><tr><th>Rotation</th><th>Rule</th></tr><tr><td>90°</td><td>(x, y) → (${MINUS}y, x)</td></tr><tr><td>180°</td><td>(x, y) → (${MINUS}x, ${MINUS}y)</td></tr><tr><td>270°</td><td>(x, y) → (y, ${MINUS}x)</td></tr></table><div class="box tip">Counterclockwise is the default. 90° clockwise = 270° counterclockwise.</div>`)
],[['Rotations',genRotate]]),
L('9.4','Compositions of Transformations','Glide reflections and double reflections.',[
  C('Compositions',`<p>A <b>composition</b> is one transformation followed by another.</p><ul><li><b>Glide reflection</b>: a translation, then a reflection in a line parallel to the translation.</li><li>Reflecting in two <b>parallel</b> lines = a <b>translation</b> (twice the distance between them).</li><li>Reflecting in two <b>intersecting</b> lines = a <b>rotation</b> (twice the angle between them).</li></ul>`)
],[['Compositions',genCompose]]),
L('9.5','Symmetry','Line symmetry and rotational symmetry.',[
  C('Line & rotational symmetry',`<p><b>Line symmetry</b>: a line divides the figure into mirror-image halves.</p><p><b>Rotational symmetry</b>: the figure looks the same after a turn less than 360°. The <b>order</b> is how many times it matches in one full turn; the <b>magnitude</b> is 360° ÷ order.</p><p>A regular hexagon has 6 lines of symmetry and rotational symmetry of order 6, magnitude 60°.</p>`,()=>{const P=regPoly(6);return fig({pts:P,polys:[{p:Object.keys(P)}],segs:[['P0','P3',{dash:true,color:C_COL}],['P1','P4',{dash:true,color:C_COL}],['P2','P5',{dash:true,color:C_COL}]],nolab:Object.keys(P),dots:[],h:200});})
],[['Symmetry',genSymmetry]]),
L('9.6','Dilations','Scale coordinates about the origin.',[

],[['Dilations',genDilate]])
]});

/* ================= UNIT 13: STATISTICAL PROBABILITY ================= */
const PROB_NOTE='<br><span class="muted small">Answer as a fraction (like 3/8), a decimal, or a percent.</span>';
function genCounting(){const t=pick(['outfit','code','coin']);
  if(t==='outfit'){const a=ri(2,8),b=ri(2,6),c=ri(2,5);return num(`You have ${a} shirts, ${b} pairs of pants, and ${c} pairs of shoes. How many different outfits are possible?`,a*b*c,[`Fundamental Counting Principle: multiply the number of choices for each step.`,`${a} · ${b} · ${c} = <b>${a*b*c}</b>`],'Multiply the choices together.');}
  if(t==='code'){const L0=ri(2,4),D=ri(1,3);return num(`A code is ${L0} letters (A–Z, repeats allowed) followed by ${D} digit${D>1?'s':''} (0–9, repeats allowed). How many codes are possible?`,26**L0*10**D,[`Letters: 26 choices each, ${L0} times → 26^${L0}`,`Digits: 10 choices each, ${D} times → 10^${D}`,`Total = 26^${L0} · 10^${D} = <b>${(26**L0*10**D).toLocaleString()}</b>`],'Each position is a separate choice — multiply.');}
  const n=ri(2,5);return num(`A coin is tossed ${n} times. How many outcomes are in the sample space?`,2**n,[`Each toss has 2 outcomes.`,`2^${n} = <b>${2**n}</b>`],'Draw a tree diagram, or multiply 2 by itself once per toss.');}
function genSampleProb(){const t=pick(['dice','coins']);
  if(t==='dice'){const s=ri(3,11);let c=0;for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)if(a+b===s)c++;const q=new Q(c,36);
    return num(`Two dice are rolled. What is the probability that the sum is ${s}?${PROB_NOTE}`,q.val(),[`The sample space has 6 · 6 = 36 equally likely outcomes.`,`Outcomes with sum ${s}: ${(()=>{const L0=[];for(let a=1;a<=6;a++){const b=s-a;if(b>=1&&b<=6)L0.push(`(${a},${b})`);}return L0.join(', ');})()} → ${c}`,`P = ${fracH(c,36)} = <b>${q.html()}</b>`],'List every pair that adds to the target sum.',{finalH:q.html(),tol:0.006});}
  const n=3,k=ri(0,3);const c=nCr(3,k);const q=new Q(c,8);return num(`Three coins are tossed. What is the probability of getting exactly ${k} head${k===1?'':'s'}?${PROB_NOTE}`,q.val(),[`Sample space: 2³ = 8 outcomes (HHH, HHT, HTH, THH, HTT, THT, TTH, TTT).`,`Exactly ${k} heads: ${c} outcome${c===1?'':'s'}.`,`P = ${fracH(c,8)} = <b>${q.html()}</b>`],'List all 8 outcomes and count.',{finalH:q.html(),tol:0.006});}
function genPermComb(){const t=pick(['perm','comb','permw','combw']);let n=ri(5,10),r=ri(2,4);
  if(t==='perm'||t==='permw'){const v=nPr(n,r);const q=t==='perm'?`Evaluate <sub>${n}</sub>P<sub>${r}</sub>.`:`In how many ways can ${r} students be chosen from ${n} for president, vice president${r>2?', secretary':''}${r>3?', and treasurer':''}${r===2?'':''}?`;
    return num(q,v,[`Order matters → <b>permutation</b>: <sub>n</sub>P<sub>r</sub> = ${fracH('n!','(n − r)!')}`,`<sub>${n}</sub>P<sub>${r}</sub> = ${Array.from({length:r},(_,i)=>n-i).join(' · ')} = <b>${v}</b>`],'Different positions/order matters → permutation.');}
  const v=nCr(n,r);const q=t==='comb'?`Evaluate <sub>${n}</sub>C<sub>${r}</sub>.`:`How many different groups of ${r} toppings can be chosen from ${n} toppings?`;
  return num(q,v,[`Order does not matter → <b>combination</b>: <sub>n</sub>C<sub>r</sub> = ${fracH('n!','r!(n − r)!')}`,`<sub>${n}</sub>C<sub>${r}</sub> = ${fracH(Array.from({length:r},(_,i)=>n-i).join(' · '),Array.from({length:r},(_,i)=>r-i).join(' · '))} = <b>${v}</b>`],'A group (no positions) → combination.');}
function genPCProb(){const g=ri(4,8),b=ri(4,8),k=ri(2,3);const tot=g+b;const fav=nCr(g,k),all=nCr(tot,k);const q=new Q(fav,all);
  return num(`A club has ${g} girls and ${b} boys. ${k} members are chosen at random. What is the probability that all ${k} are girls?${PROB_NOTE}`,q.val(),[`Total groups: <sub>${tot}</sub>C<sub>${k}</sub> = ${all}`,`All-girl groups: <sub>${g}</sub>C<sub>${k}</sub> = ${fav}`,`P = ${fracH(fav,all)} = <b>${q.html()}</b>`],'P = (number of favorable groups) ÷ (number of possible groups). Use combinations for both.',{finalH:q.html(),tol:0.003});}
function genGeoProb(){const t=pick(['seg','target','square']);
  if(t==='seg'){const a=ri(0,6),b=a+ri(2,6),c=b+ri(2,8),d=c+ri(2,6);const q=new Q(c-b,d-a);
    return num(`Point X is chosen at random on <span style="text-decoration:overline">AD</span>, where A = ${a}, B = ${b}, C = ${c}, D = ${d} on a number line. Find P(X is on <span style="text-decoration:overline">BC</span>).${PROB_NOTE}`,q.val(),[`Geometric probability (length): P = ${fracH('length of BC','length of AD')}`,`= ${fracH(`${c} ${MINUS} ${b}`,`${d} ${MINUS} ${a}`)} = ${fracH(c-b,d-a)} = <b>${q.html()}</b>`],'Compare the length you want with the whole length.',{finalH:q.html(),tol:0.006,visual:fig({pts:{A:[a,0],B:[b,0],C:[c,0],D:[d,0]},segs:[['A','D'],['B','C',{color:A_COL,w:5}]],h:120,lpos:{A:[0,-16],B:[0,-16],C:[0,-16],D:[0,-16]}})});}
  if(t==='target'){const r1_=ri(1,4),r2_=r1_+ri(1,5);const q=new Q(r1_*r1_,r2_*r2_);
    return num(`A dart lands randomly on a circular target of radius ${r2_}. The bullseye has radius ${r1_}. What is P(bullseye)?${PROB_NOTE}`,q.val(),[`P = ${fracH('area of bullseye','area of target')} = ${fracH(`π(${r1_})²`,`π(${r2_})²`)}`,`= ${fracH(r1_*r1_,r2_*r2_)} = <b>${q.html()}</b> (the π's cancel)`],'Compare areas: πr² for each circle.',{finalH:q.html(),tol:0.006,visual:fig({pts:{O:[0,0]},circles:[{c:'O',r:r2_},{c:'O',r:r1_,fill:A_COL,op:.4}],nolab:['O'],dots:[],h:210})});}
  const s=2*ri(2,6);const p=Math.PI/4;return num(`A circle is inscribed in a square with side ${s}. A point is chosen at random inside the square. What is the probability it lands inside the circle? <span class="muted small">Round to the nearest hundredth (or type π/4).</span>`,p,[`Circle radius = ${s/2}; circle area = π(${s/2})² = ${s*s/4}π`,`Square area = ${s}² = ${s*s}`,`P = ${fracH(s*s/4+'π',s*s)} = ${fracH('π',4)} ≈ <b>0.79</b>`],'Area of circle ÷ area of square.',{tol:0.006,finalH:'π/4 ≈ 0.79',visual:fig({pts:{A:[0,0],B:[s,0],C:[s,s],D:[0,s],O:[s/2,s/2]},polys:[{p:['A','B','C','D']}],circles:[{c:'O',r:s/2,fill:A_COL,op:.3}],nolab:['A','B','C','D','O'],dots:[],h:210})});}
function genSim(){const t=pick(['exp','expected','design']);

function genPercent(){const t=pick(['of','disc','tax','change','tip','find']);

function genStats(){const t=pick(['mean','median','range','missing','mode']);const n=pick([5,6,7]);const d=Array.from({length:n},()=>ri(2,30));const s=d.reduce((a,b)=>a+b,0);const srt=d.slice().sort((a,b)=>a-b);

function approxQ(v,maxD=60){for(let d=1;d<=maxD;d++){const n=Math.round(v*d);if(Math.abs(n/d-v)<1e-9)return new Q(n,d);}return null;}
function stripNotes(h){return h.replace(/<br><span class="muted small">[\s\S]*?<\/span>/g,'').replace(/\s*<span class="muted small">[\s\S]*?<\/span>/g,'').replace(/ Answer in slope-intercept form <b>y = mx \+ b<\/b> — type the slope m and the y-intercept b\./,'').replace(/ The third side x must satisfy ___ &lt; x &lt; ___\. Fill in the two numbers\./,' What are the possible lengths of the third side x?').replace(/ Write the rule \(x, y\) → \(x \+ a, y \+ b\)\. Find a and b\./,' Which rule describes the translation?');}
function pickDistinct(right,cands,n=3){const out=[],seen=new Set([right]);for(const c of cands){if(c==null)continue;if(!seen.has(c)){seen.add(c);out.push(c);}if(out.length===n)break;}return out;}
function numChoices(p){const a=p.answer,u=p.unit||'',f=p.finalH||'';const U=s=>s+(u==='°'?'°':u==='%'?'%':'');
  if(/π/.test(f)){const k=approxQ(a/Math.PI,12);if(k){const P=q=>q.eq(1)?'π':q.html()+'π';return {right:P(k),wrong:pickDistinct(P(k),shuffle([k.mul(2),k.div(2),k.mul(new Q(3,2)),k.add(4)]).map(P))};}}
  const m=f.match(/^(\d*)√(\d+)$/);if(m){const o=+(m[1]||1),i=+m[2];const R=(oo,ii)=>(oo===1?'':oo)+'√'+ii;return {right:f,wrong:pickDistinct(f,shuffle([R(o*2,i),R(o+1,i),String(o*o*i),R(o,i+1)]))};}
  if(Number.isInteger(a)){const c=[];if(u==='°'){if(180-a>0&&180-a!==a)c.push(180-a);if(90-a>0&&90-a!==a)c.push(90-a);}
    const t2=shuffle([a*2,Math.round(a/2),a+10,a-10].filter(v=>v!==a&&(a<0||v>=0)));const t3=shuffle([a+1,a-1,a+2,a-2,a+5,a-5].filter(v=>a<0||v>=0));
    const cand=[...c.slice(0,1),...t2.slice(0,1),...shuffle([...c.slice(1),...t2.slice(1),...t3])];return {right:U(fmtN(a)),wrong:pickDistinct(U(fmtN(a)),cand.map(v=>U(fmtN(v))))};}
  const q=approxQ(a,40);const term=q&&[2,4,5,8,10,20,25].includes(q.d)&&!/frac/.test(f);if(q&&q.d<=40&&!term){const H=x=>U(x.html());let c;
    if(a>0&&a<1){c=[new Q(1).sub(q),new Q(q.n+1,q.d),new Q(q.n,q.d+1),new Q(Math.max(1,q.n-1),q.d),new Q(q.n,Math.max(q.n+1,q.d-1)),new Q(2*q.n,q.d)].filter(x=>x.val()>0&&x.val()<1);}
    else{c=[q.neg(),new Q(q.n+1,q.d),new Q(q.n,q.d+1),new Q(q.n*2,q.d)];if(q.n!==0)c.push(new Q(q.d,q.n),new Q(-q.d,q.n));if(a>0)c=c.filter(x=>x.val()>0);}
    return {right:H(q),wrong:pickDistinct(H(q),shuffle(c).map(H))};}
  const dg=term?(q.d<=2?1:q.d<=10?2:3):(p.tol||0)>=0.05?1:2;const R=v=>U(fm(+v.toFixed(dg)));return {right:R(a),wrong:pickDistinct(R(a),shuffle([a*1.25,a*0.8,a*1.5,a+(a>10?5:1),a*2]).map(R))};}
function multiChoices(p){const F=p.fields,lab=F.map(f=>f.label.trim()),v=F.map(f=>f.answer);const key=lab.join('|');
  if(p.unordered){const fx=x=>fm(+x.toFixed(2));if(Math.abs(v[0]+v[1])<1e-9&&v[0]!==0){const k=Math.abs(v[0]);return {right:`x = ±${fx(k)}`,wrong:pickDistinct(`x = ±${fx(k)}`,[`x = ${fx(k)} only`,`x = ±${fx(k*k)}`,`x = ±${fx(k*2)}`,`x = ±${fx(k/2)}`])};}

  if(key==='a =|b ='){const R=(a,b)=>`(x, y) → (x ${a<0?MINUS+' '+(-a):'+ '+a}, y ${b<0?MINUS+' '+(-b):'+ '+b})`;const [a,b]=v;return {right:R(a,b),wrong:pickDistinct(R(a,b),shuffle([R(-a,-b),R(b,a),R(-a,b),R(a,-b)]))};}
  const G=vals=>F.map((f,i)=>`${f.label.replace(/=\s*$/,'').trim()} ${fm(vals[i])}`).join(', ');
  return {right:G(v),wrong:pickDistinct(G(v),shuffle([v.slice().reverse(),v.map((x,i)=>i===0?x+5:x),v.map((x,i)=>i===1?x+5:x),v.map((x,i)=>i===0?x-5:x)]).map(G))};}
function toMC(p){if(!p)return p;if(p.kind==='mc')return p;
  const c=p.kind==='num'?numChoices(p):p.kind==='multi'?multiChoices(p):null;if(!c||c.wrong.length<3)return null;
  return mc(stripNotes(p.prompt),[c.right,...c.wrong],0,p.steps,p.hint,{visual:p.visual||''});}
const asMC=g=>()=>{for(let k=0;k<12;k++){const p=toMC(g());if(p)return p;}return null;};

{title:'The Oyster Comeback',text:`<p>A single adult oyster can filter up to fifty gallons of water in a day. As it feeds, it pulls in tiny bits of algae and sediment and leaves the water clearer than before. For this reason, scientists sometimes call oysters "nature's water filters."</p><p>Over the past century, however, oyster populations in many East Coast bays dropped sharply. Overharvesting, pollution, and disease all played a part. With fewer oysters, the bays grew cloudier, and sunlight could no longer reach the underwater grasses that young fish use for shelter.</p><p>Today, volunteers are helping oysters make a comeback. In some programs, families raise baby oysters in mesh cages hung from docks. After a year, the young oysters are moved to protected reefs. Restaurants also donate their used shells, which are cleaned and returned to the water. Baby oysters attach to the old shells and build new reefs on top of them.</p><p>These reefs do more than clean water. They also break up waves before the waves reach the shore, which helps protect beaches from erosion. A healthy reef can be home to dozens of other species, from crabs to small fish. Restoring oysters, it turns out, helps restore the whole bay.</p>`,
 qs:[{q:'What is the <b>main idea</b> of the passage?',c:['Bringing back oysters improves the health of entire bays.','Oysters are popular in restaurants.','Scientists do not understand why oysters disappeared.','Volunteers should not touch oysters.'],s:['Every paragraph builds toward the last sentence: restoring oysters helps restore the whole bay.'],h:'What does the final paragraph conclude?'},

{title:'The Night Watch',text:`<p>Mara had begged for weeks to stay up for the night watch at her grandfather's marina. Now, at two in the morning, with the wind tugging at her jacket, she wasn't so sure it had been a good idea.</p><p>"Check the lines on slip twelve," Grandpa said, handing her a flashlight. His voice was calm, the same voice he used when he read the newspaper.</p><p>Mara hurried down the dock. The boats knocked against their bumpers like restless horses. At slip twelve, one rope had slipped loose and the little sailboat was drifting toward its neighbor. Her heart pounded. She remembered how Grandpa tied a cleat hitch — loop, cross, loop, tuck — and she pulled the rope tight, her fingers numb with cold.</p><p>When she came back, Grandpa raised an eyebrow. "Everything all right?"</p><p>"It is now," Mara said. She tried to sound as calm as he did, but she couldn't stop grinning.</p><p>Grandpa nodded slowly and poured her a cup of cocoa from his thermos. "Then I guess I've got a new first mate," he said.</p>`,
 qs:[{q:'How does Mara <b>change</b> during the story?',c:['She goes from unsure to proud and confident.','She goes from brave to frightened.','She goes from angry to sad.','She does not change at all.'],s:['At first she "wasn\'t so sure"; after fixing the rope she "couldn\'t stop grinning."'],h:'Compare how she feels at the beginning and the end.'},

{title:'Surfmen of the Life-Saving Service',text:`<p>In the 1800s, the coast of New Jersey was one of the most dangerous places in the world for ships. Hidden sandbars lay just offshore, and winter storms could drive a ship aground within sight of the beach. Many sailors drowned only a few hundred yards from land.</p><p>To solve this problem, the United States created a chain of lifesaving stations along the coast. In 1878, these stations became part of a separate agency, the U.S. Life-Saving Service. Each station had a keeper and a crew of "surfmen." During storms, surfmen walked the beach all night, watching for ships in trouble.</p><p>When they spotted a wreck, the crew had two main choices. If the waves were not too high, they rowed a surfboat out to the ship. If the sea was too rough, they fired a line from a small cannon to the ship's mast. Then they used the line to pull sailors to shore, one at a time, in a device called a breeches buoy.</p><p>The work was exhausting and dangerous, and the surfmen were paid little. Still, they rescued thousands of people. In 1915, the Life-Saving Service joined with the Revenue Cutter Service to form the United States Coast Guard, which continues their mission today.</p>`,
 qs:[{q:'What was the main <b>problem</b> the lifesaving stations were created to solve?',c:['Sailors were drowning in shipwrecks close to shore.','Ships could not find their way into port.','There were not enough lighthouses.','Pirates were attacking ships.'],s:['Paragraph 1 describes ships running aground and sailors drowning near the beach.'],h:'Look at the end of paragraph 1.'},

  {q:'According to the passage, when did the surfmen use the cannon?',c:['When the sea was too rough to row out','When the ship was on fire','When it was daytime','When the ship was far from shore in calm water'],s:['"If the sea was too rough, they fired a line from a small cannon."'],h:'Find the word "cannon."'},
  {q:'Which sentence best supports the idea that surfmen were dedicated to their work?',c:['"The work was exhausting and dangerous, and the surfmen were paid little. Still, they rescued thousands of people."','"In 1878, these stations became part of a separate agency."','"Hidden sandbars lay just offshore."','"Each station had a keeper and a crew."'],s:['They kept saving lives even though the job was hard, risky, and poorly paid.'],h:'Which sentence shows them working hard despite difficulties?'},
  {q:'What happened to the Life-Saving Service in 1915?',c:['It combined with another agency to form the U.S. Coast Guard.','It was shut down because it was no longer needed.','It moved its stations to the Pacific coast.','It began building lighthouses.'],s:['The last paragraph: it joined the Revenue Cutter Service to form the Coast Guard.'],h:'Look at the last paragraph.'}]},
{title:'Let Students Sleep',text:`<p>Every school morning, thousands of teenagers drag themselves out of bed before the sun rises. Our school should push back its start time by one hour. A later start would help students stay healthier and learn more.</p><p>Doctors who study sleep explain that teenagers' body clocks naturally shift later during puberty. Most teens cannot fall asleep before about eleven at night, yet they need eight to ten hours of sleep. When school begins at 7:30, many students get only six or seven hours.</p><p>Tired students struggle in class. They have trouble paying attention and remembering what they learned. Several school districts that moved their start times later have reported better attendance and fewer students falling asleep in first period.</p><p>Some people argue that a later start would interfere with after-school sports and jobs. This concern is understandable, but practices could be shifted slightly later, and many activities already take place in the evening. A small schedule change is worth it if students are healthier and more focused.</p><p>Our school board should vote to start the school day at 8:30. Our students — and their grades — will thank us.</p>`,
 qs:[{q:'What is the author\'s main <b>claim</b>?',c:['The school should start one hour later.','Teenagers should go to bed earlier.','After-school sports should be canceled.','Doctors should teach classes.'],s:['Paragraph 1 states it directly: "Our school should push back its start time by one hour."'],h:'Look for the sentence that says what should be done.'},

  {q:'Why does the author mention that teenagers\' body clocks shift during puberty?',c:['To explain why teens can\'t easily fall asleep earlier','To prove that teens are lazy','To describe how clocks work','To argue against sleep research'],s:['It shows that staying up late is natural for teens, so an early start cuts into their sleep.'],h:'How does this fact connect to the claim?'},

function genRatio(){const t=pick(['unit','best','scale','k','isprop']);
  if(t==='unit'){const q=ri(3,12),u=ri(25,300);const tot=q*u/100;
    return num(`${q} bottles of water cost ${money(tot)}. What is the price per bottle (in dollars)?`,u/100,[`Unit rate = total ÷ quantity`,`${money(tot)} ÷ ${q} = <b>${money(u/100)}</b> per bottle`],'Divide the total cost by the number of items.',{finalH:money(u/100)});}
  if(t==='best'){let q1,q2,u1,u2;do{q1=ri(4,16);q2=ri(4,16);u1=ri(20,90);u2=ri(20,90);}while(q1===q2||u1===u2);const p1=q1*u1/100,p2=q2*u2/100;const ch=[`${q1} oz for ${money(p1)}`,`${q2} oz for ${money(p2)}`];
    return mcFixed(`Which is the better buy?`,[ch[0],ch[1],'They cost the same per ounce'],u1<u2?0:1,[`Find each unit price: ${money(p1)} ÷ ${q1} = ${money(u1/100)} per oz; ${money(p2)} ÷ ${q2} = ${money(u2/100)} per oz.`,`The lower unit price is the better buy: <b>${u1<u2?ch[0]:ch[1]}</b>.`],'Compare the price per ounce, not the total price.');}
  if(t==='scale'){const a=ri(2,5),b=pick([12,18,24,30]),k=pick([2,3,new Q(1,2),new Q(3,2)].map(Q.of));const c=k.mul(b).val(),ans=k.mul(a);
    return num(`A recipe uses ${a} cups of flour to make ${b} cookies. How many cups of flour are needed for ${fm(c)} cookies?`,ans.val(),[`Set up a proportion: ${fracH(a+' cups',b+' cookies')} = ${fracH('x',fm(c)+' cookies')}`,`${fm(c)} is ${k.html()} times ${b}, so x = ${a} × ${k.html()} = <b>${ans.html()}</b> cups`],'Keep cups on top and cookies on the bottom on both sides.',{finalH:ans.html()});}
  if(t==='k'){const k=pick([2,3,4,5,new Q(5,2),new Q(3,4),new Q(3,2)].map(Q.of));const xs=[2,4,6,8].map(x=>x*k.d/ (k.d===1?1:1));const rows=xs.map(x=>`<tr><td>${x}</td><td>${fm(k.mul(x).val())}</td></tr>`).join('');
    return num(`<table class="tt"><tr><th>x</th><th>y</th></tr>${rows}</table>y is proportional to x. What is the constant of proportionality (k in y = kx)?`,k.val(),[`k = ${fracH('y','x')} for any row.`,`${fm(k.mul(xs[0]).val())} ÷ ${xs[0]} = <b>${fm(k.val())}</b>`],'Divide y by x.',{finalH:fm(k.val())});}
  const k=ri(2,6),prop=Math.random()<.5;const xs=[1,2,3,4];const ys=xs.map(x=>k*x+(prop?0:ri(1,3)));const rows=xs.map((x,i)=>`<tr><td>${x}</td><td>${ys[i]}</td></tr>`).join('');
  return mcFixed(`<table class="tt"><tr><th>x</th><th>y</th></tr>${rows}</table>Is this a proportional relationship?`,['Yes','No'],prop?0:1,[`A relationship is proportional if y ÷ x is the same for every row (and the line passes through the origin).`,`y ÷ x: ${xs.map((x,i)=>fm(r2(ys[i]/x))).join(', ')}`,prop?'<b>Yes</b> — the ratio is constant.':'<b>No</b> — the ratio changes.'],'Check y ÷ x for each row.');}
function genRational(){const t=pick(['add','mul','div','int','mixed']);const F=()=>{let n,d;do{d=pick([2,3,4,5,6,8,10,12]);n=ri(-11,11);}while(n===0||Math.abs(n)===d||gcd(n,d)!==1);return new Q(n,d);};
  if(t==='add'){const a=F(),b=F(),op=pick(['+','−']);const r=op==='+'?a.add(b):a.sub(b);const L0=a.d*b.d/gcd(a.d,b.d);
    return num(`Evaluate: <span class="math">${a.html()} ${op} ${b.ph()}</span>`,r.val(),[`Common denominator: ${L0}.`,`${a.html()} = ${fracH(fmtN(a.n*L0/a.d),L0)} and ${b.html()} = ${fracH(fmtN(b.n*L0/b.d),L0)}`,`${op==='+'?'Add':'Subtract'} the numerators and simplify: <b>${r.html()}</b>`],'Find a common denominator first. Watch the signs.',{finalH:r.html()});}
  if(t==='mul'){const a=F(),b=F();const r=a.mul(b);return num(`Evaluate: <span class="math">${a.ph()} × ${b.ph()}</span>`,r.val(),[`Multiply across: ${fracH(`${fmtN(a.n)} × ${par(b.n)}`,`${a.d} × ${b.d}`)}`,`Simplify: <b>${r.html()}</b>`,`Sign check: ${(a.n<0)!==(b.n<0)?'one negative → negative':'same signs → positive'}.`],'Numerator × numerator, denominator × denominator. Same signs → positive.',{finalH:r.html()});}
  if(t==='div'){const a=F(),b=F();const r=a.div(b);return num(`Evaluate: <span class="math">${a.ph()} ÷ ${b.ph()}</span>`,r.val(),[`Keep, change, flip: ${a.ph()} × ${new Q(b.d,b.n).ph()}`,`= <b>${r.html()}</b>`],'Dividing by a fraction = multiplying by its reciprocal.',{finalH:r.html()});}
  if(t==='mixed'){let w1,n1,d1,w2,n2,d2;do{w1=ri(1,4);n1=ri(1,3);d1=n1+ri(1,4);w2=ri(1,3);n2=ri(1,3);d2=n2+ri(1,4);}while(gcd(n1,d1)!==1||gcd(n2,d2)!==1);const a=new Q(w1*d1+n1,d1),b=new Q(w2*d2+n2,d2);const r=a.mul(b);
    const mix=q=>{const w=Math.floor(q.n/q.d),rr=q.n-w*q.d;return rr?`${w?w+' ':''}${fracH(rr,q.d)}`:String(w);};
    return num(`Evaluate: <span class="math">${w1} ${fracH(n1,d1)} × ${w2} ${fracH(n2,d2)}</span>`,r.val(),[`Change to improper fractions: ${a.html()} × ${b.html()}`,`Multiply: ${r.html()}`,`= <b>${mix(r)}</b>`],'Convert mixed numbers to improper fractions before multiplying.',{finalH:r.html()});}
  const a=ri(-9,9),b=ri(2,6),c=ri(-6,6),d=ri(-9,-1);const v=a+b*c-d;

function genInequality(){const t=pick(['solve','solve','word','member']);
  if(t==='word'){const have=ri(30,90),per=ri(4,12),fee=ri(0,10);const mx=Math.floor((have-fee)/per);
    return num(`Maya has $${have}. ${fee?`She pays a $${fee} entry fee and then `:'She '}buys game tokens that cost $${per} each. What is the <b>greatest</b> number of tokens she can buy?`,mx,[`Inequality: ${fee?fee+' + ':''}${per}t ≤ ${have}`,`${per}t ≤ ${have-fee} → t ≤ ${fm(r2((have-fee)/per))}`,`She can't buy part of a token, so the greatest whole number is <b>${mx}</b>.`],'"At most" or "can spend" means ≤. Round DOWN to a whole number.');}
  let a,b,x;do{a=pick([2,3,4,5,-2,-3,-4]);b=ri(-10,10);x=ri(-6,8);}while(b===0);const c=a*x+b;const op=pick(['<','>','≤','≥']);const flip={'<':'>','>':'<','≤':'≥','≥':'≤'};const res=a<0?flip[op]:op;
  if(t==='member'){const ok=v=>res==='<'?v<x:res==='>'?v>x:res==='≤'?v<=x:v>=x;const good=shuffle([x-3,x-2,x-1,x,x+1,x+2,x+3].filter(ok))[0];const badv=shuffle([x-3,x-2,x-1,x,x+1,x+2,x+3].filter(v=>!ok(v))).slice(0,3);
    return mc(`Which value of x is a solution of <span class="math">${poly([a,'x'],[b,''])} ${op} ${fmtN(c)}</span>?`,[fmtN(good),...badv.map(fmtN)],0,[`Solve: ${poly([a,'x'])} ${op} ${fmtN(c-b)}`,a<0?`Divide by ${a} — a negative — so <b>flip</b> the sign: x ${res} ${fmtN(x)}`:`Divide by ${a}: x ${res} ${fmtN(x)}`,`Only <b>${fmtN(good)}</b> makes x ${res} ${fmtN(x)} true.`],'Solve the inequality first, or plug each choice in.');}
  return mc(`Solve: <span class="math">${poly([a,'x'],[b,''])} ${op} ${fmtN(c)}</span>`,[`x ${res} ${fmtN(x)}`,`x ${flip[res]} ${fmtN(x)}`,`x ${res} ${fmtN(-x)}`,`x ${res} ${fm(r2((c+b)/a))}`],0,[`${b>0?'Subtract '+b:'Add '+(-b)} on both sides: ${poly([a,'x'])} ${op} ${fmtN(c-b)}`,a<0?`Divide both sides by ${a}. Dividing by a <b>negative</b> flips the inequality: <b>x ${res} ${fmtN(x)}</b>`:`Divide both sides by ${a}: <b>x ${res} ${fmtN(x)}</b>`],'Solve like an equation — but flip the sign if you multiply or divide by a negative.');}
function genExpr(){const t=pick(['simp','simp','eval','equiv']);
  if(t==='eval'){const a=ri(2,5),b=ri(2,6),x=ri(-4,4),y=ri(-5,6);const v=a*x*x-b*y;
    return num(`Evaluate <span class="math">${a}x² ${MINUS} ${b}y</span> when x = ${fmtN(x)} and y = ${fmtN(y)}.`,v,[`Substitute: ${a}${par(x)}² ${MINUS} ${b}${par(y)}`,`Exponent first: ${par(x)}² = ${x*x}`,`${a}·${x*x} ${MINUS} ${b}·${par(y)} = ${a*x*x} ${MINUS} ${par(b*y)} = <b>${fmtN(v)}</b>`],'Use parentheses when you substitute negatives. Square before multiplying.');}
  const a=ri(2,5),b=ri(1,4),c=pick([1,2,3,4,5,-2,-3,-4]),d=ri(1,7),e=ri(-9,9);const X=a*b-d,K=a*c+e;
  const E=(x,k)=>poly([x,'x'],[k,''])||'0';const right=E(X,K);
  const ch=[right,E(a*b-d,c+e),E(a*b+d,K),E(b-d,a*c+e),E(X,-K)];
  return mc(`${t==='equiv'?'Which expression is equivalent to':'Simplify:'} <span class="math">${a}(${poly([b,'x'],[c,''])}) ${MINUS} ${d===1?'':d}x ${e<0?MINUS+' '+(-e):'+ '+e}</span>${t==='equiv'?'?':''}`,ch,0,
    [`Distribute: ${a}(${poly([b,'x'],[c,''])}) = ${poly([a*b,'x'],[a*c,''])}`,`Combine x-terms: ${a*b}x ${MINUS} ${d}x = ${fmtN(X)}x`,`Combine constants: ${fmtN(a*c)} ${e<0?MINUS+' '+(-e):'+ '+e} = ${fmtN(K)}`,`<b>${right}</b>`],'Distribute to EVERY term inside the parentheses, then combine like terms.');}

  return `<div style="padding:10px"><table style="border-collapse:collapse;font-size:17px;font-variant-numeric:tabular-nums"><tr><th style="padding-right:10px">Stem</th><th style="text-align:left;padding-left:10px">Leaf</th></tr>${r}</table><div class="small muted" style="margin-top:6px">Key: ${Math.floor(d[0]/10)} | ${d[0]%10} = ${d[0]}</div></div>`;}
function genStemLeaf(){const n=pick([9,11,13]);const base=ri(2,5)*10;const d=Array.from({length:n},()=>base+ri(0,39));const s=d.slice().sort((a,b)=>a-b);const t=pick(['median','range','mode','count']);
  if(t==='mode'){const v=pick(s);d.push(v);d.push(v);const s2=d.slice().sort((a,b)=>a-b);const c={};s2.forEach(x=>c[x]=(c[x]||0)+1);const mx=Math.max(...Object.values(c));const ms=Object.keys(c).filter(k=>c[k]===mx);if(ms.length>1)return genStemLeaf();
    return num(`What is the <b>mode</b> of the data in the stem-and-leaf plot?`,+ms[0],[`Read each value as stem (tens) + leaf (ones).`,`The value that appears most often is <b>${ms[0]}</b>.`],'Look for the leaf that repeats on the same stem.',{visual:stemLeafHTML(d)});}
  if(t==='median')return num(`What is the <b>median</b> of the data in the stem-and-leaf plot?`,s[(n-1)/2],[`There are ${n} values. A stem-and-leaf plot is already in order.`,`The median is value number ${(n+1)/2}: <b>${s[(n-1)/2]}</b>`],'Count to the middle value.',{visual:stemLeafHTML(d)});
  if(t==='range')return num(`What is the <b>range</b> of the data in the stem-and-leaf plot?`,s[n-1]-s[0],[`Greatest = ${s[n-1]}, least = ${s[0]}.`,`Range = ${s[n-1]} ${MINUS} ${s[0]} = <b>${s[n-1]-s[0]}</b>`],'Last value minus first value.',{visual:stemLeafHTML(d)});
  const cut=base+ri(10,29);const c=s.filter(v=>v>cut).length;return num(`How many values in the stem-and-leaf plot are <b>greater than ${cut}</b>?`,c,[`Values greater than ${cut}: ${s.filter(v=>v>cut).join(', ')}`,`Count: <b>${c}</b>`],'Read the values from the bottom rows up.',{visual:stemLeafHTML(d)});}
function boxSVG(f){const [mn,q1,md,q3,mx]=f;const lo=Math.floor(mn/10)*10-10,hi=Math.ceil(mx/10)*10+10;const W=440,X=v=>30+(v-lo)/(hi-lo)*(W-60);let s=`<svg viewBox="0 0 ${W} 170" class="fig">`;
  for(let v=lo;v<=hi;v+=10)s+=`<line x1="${X(v)}" y1="118" x2="${X(v)}" y2="126" stroke="#1d2433"/><text x="${X(v)}" y="142" font-size="12" text-anchor="middle" fill="#5d6678">${v}</text>`;
  s+=`<line x1="${X(lo)}" y1="122" x2="${X(hi)}" y2="122" stroke="#1d2433" stroke-width="1.5"/><line x1="${X(mn)}" y1="60" x2="${X(q1)}" y2="60" stroke="#1d2433" stroke-width="2.2"/><line x1="${X(q3)}" y1="60" x2="${X(mx)}" y2="60" stroke="#1d2433" stroke-width="2.2"/><line x1="${X(mn)}" y1="48" x2="${X(mn)}" y2="72" stroke="#1d2433" stroke-width="2.2"/><line x1="${X(mx)}" y1="48" x2="${X(mx)}" y2="72" stroke="#1d2433" stroke-width="2.2"/><rect x="${X(q1)}" y="35" width="${X(q3)-X(q1)}" height="50" fill="#eef1ff" stroke="#3550e6" stroke-width="2.2"/><line x1="${X(md)}" y1="35" x2="${X(md)}" y2="85" stroke="#3550e6" stroke-width="3"/>`;

function genBoxPlot(){let f;do{const mn=ri(10,40),q1=mn+ri(3,15),md=q1+ri(2,12),q3=md+ri(2,12),mx=q3+ri(3,15);f=[mn,q1,md,q3,mx];}while(f[4]>110);const [mn,q1,md,q3,mx]=f;const t=pick(['median','iqr','range','pct','pct2']);

  if(t==='iqr')return num(`What is the <b>interquartile range</b> (IQR) shown in the box-and-whisker plot?`,q3-q1,[`The box runs from Q1 = ${q1} to Q3 = ${q3}.`,`IQR = Q3 ${MINUS} Q1 = ${q3} ${MINUS} ${q1} = <b>${q3-q1}</b>`],'IQR = width of the box.',{visual:vis});
  if(t==='range')return num(`What is the <b>range</b> of the data in the box-and-whisker plot?`,mx-mn,[`The whiskers end at the minimum (${mn}) and maximum (${mx}).`,`Range = ${mx} ${MINUS} ${mn} = <b>${mx-mn}</b>`],'End of right whisker minus end of left whisker.',{visual:vis});
  if(t==='pct')return num(`About what percent of the data is <b>greater than ${q3}</b>?`,25,[`Each section of a box plot (whisker, half-box, half-box, whisker) holds about <b>25%</b> of the data.`,`${q3} is Q3, so about <b>25%</b> of the data is above it.`],'Each of the four parts holds 25% of the data.',{visual:vis,unit:'%'});

function scatterSVG(pts,line){const W=360,H=280,p=34;const xs=pts.map(a=>a[0]),ys=pts.map(a=>a[1]);const x0=0,x1=Math.max(...xs)+2,y0=0,y1=Math.max(...ys)+5;const X=x=>p+(x-x0)/(x1-x0)*(W-2*p),Y=y=>H-p-(y-y0)/(y1-y0)*(H-2*p);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="fig"><line x1="${p}" y1="${H-p}" x2="${W-p/2}" y2="${H-p}" stroke="#1d2433"/><line x1="${p}" y1="${H-p}" x2="${p}" y2="${p/2}" stroke="#1d2433"/>`;
  if(line)s+=`<line x1="${X(0)}" y1="${Y(line[1])}" x2="${X(x1)}" y2="${Y(line[0]*x1+line[1])}" stroke="${A_COL}" stroke-width="2" stroke-dasharray="6 4"/>`;
  for(const [x,y] of pts)s+=`<circle cx="${X(x)}" cy="${Y(y)}" r="4.5" fill="#3550e6"/>`;return s+'</svg>';}
function genScatter(){const t=pick(['pos','neg','none','predict']);
  if(t==='predict'){const m=pick([2,3,4,5]),b=ri(5,20);const pts=Array.from({length:12},()=>{const x=ri(1,12);return [x,Math.max(1,m*x+b+ri(-4,4))];});const xq=ri(14,20);const v=m*xq+b;
    return mcNum(`The line of best fit for this scatter plot is <b>${lineH(m,b)}</b>. Predict y when x = ${xq}.`,v,[v+m,v-m*2,m*xq,xq+b],[`Substitute x = ${xq}: y = ${m}(${xq}) + ${b} = <b>${v}</b>`],'Plug the x-value into the line of best fit.',{visual:scatterSVG(pts,[m,b])});}
  const pts=Array.from({length:14},()=>{const x=ri(1,15);const y=t==='pos'?2*x+ri(-4,4)+5:t==='neg'?40-2*x+ri(-4,4):ri(3,35);return [x,Math.max(1,y)];});
  return mcFixed(`What type of correlation does this scatter plot show?`,['Positive correlation','Negative correlation','No correlation'],['pos','neg','none'].indexOf(t),[`Positive: as x increases, y tends to increase (points rise to the right).`,`Negative: as x increases, y tends to decrease (points fall to the right).`,`No correlation: no clear pattern.`,`This plot shows <b>${t==='pos'?'positive':t==='neg'?'negative':'no'} correlation</b>.`],'Do the points go up, go down, or scatter randomly from left to right?',{visual:scatterSVG(pts)});}
function genFracParts(){const t=pick(['simple','remain','reverse']);
  if(t==='simple'){const d=pick([3,4,5,6,8]),n=ri(1,d-1),tot=d*ri(4,12);if(gcd(n,d)!==1)return genFracParts();return num(`A class has ${tot} students. ${fracH(n,d)} of them walk to school. How many students do <b>not</b> walk?`,tot-tot*n/d,[`Walkers: ${fracH(n,d)} × ${tot} = ${tot*n/d}`,`Not walking: ${tot} ${MINUS} ${tot*n/d} = <b>${tot-tot*n/d}</b>`,`(Or: ${fracH(d-n,d)} × ${tot} = ${tot*(d-n)/d}.)`],'Find the fraction that walks, then subtract — or use the fraction that does NOT walk.');}
  if(t==='remain'){const a=pick([2,3,4]),b=pick([3,4,5]);const start=a*b*ri(4,12);const s1=start/a,left1=start-s1,s2=left1/b,left=left1-s2;
    return num(`Jay had $${start}. He spent ${fracH(1,a)} of it on a game, then ${fracH(1,b)} of what was left on lunch. How much money does he have now?`,left,[`Game: ${fracH(1,a)} × ${start} = $${s1}. Left: $${left1}.`,`Lunch: ${fracH(1,b)} × ${left1} = $${s2} (of what was <b>left</b>, not the original).`,`Now: ${left1} ${MINUS} ${s2} = <b>$${left}</b>`],'The second fraction is of the REMAINING amount.');}
  const d=pick([3,4,5]),n=ri(1,d-1);if(gcd(n,d)!==1)return genFracParts();const part=(d-n)*ri(3,12);const whole=part*d/(d-n);
  return num(`Maya read ${fracH(n,d)} of a book and has ${part} pages left. How many pages are in the book?`,whole,[`Pages left = ${fracH(d-n,d)} of the book.`,`${fracH(d-n,d)} × B = ${part} → B = ${part} × ${fracH(d,d-n)} = <b>${whole}</b>`],'What fraction is LEFT? That fraction of the whole equals the pages left.');}

function buildTest(section,n){const qs=[];
  if(section==='math'){const seen=new Set();const per=DOMAINS.map((_,i)=>Math.floor(n/3)+(i<n%3?1:0));
    DOMAINS.forEach((dom,di)=>{const subs=MATH_TOPICS.filter(t=>t[1]===dom);const order=[];while(order.length<per[di])order.push(...shuffle(subs));
      for(const [name,,gens] of order.slice(0,per[di])){let p=null;for(let k=0;k<25&&!p;k++){let c=null;try{c=pick(gens)();}catch(e){}if(c&&!seen.has(c.prompt)){p=c;seen.add(c.prompt);}}if(p){p.topic=name;p.domain=dom;qs.push(p);}}});
    return shuffle(qs);}
  const plan=n>=40?{single:2,per:5,pair:1,pairQ:6}:n>=20?{single:1,per:4,pair:1,pairQ:4}:{single:1,per:3,pair:0,pairQ:0};
  const nOther=n-plan.single*plan.per-plan.pair*plan.pairQ;
  const byTopic={};for(const [name,items] of ELA_TOPICS)byTopic[name]=shuffle(items.map(it=>({name,it})));const names=shuffle(Object.keys(byTopic));const picked=[];let r=0;
  while(picked.length<nOther&&names.some(k=>byTopic[k].length)){const k=names[r++%names.length];if(byTopic[k].length)picked.push(byTopic[k].pop());}
  for(const {name,it} of picked){const p=mc(it.q,it.c,0,it.s,it.h);p.topic=name;qs.push(p);}
  for(const P of shuffle(PASSAGES).slice(0,plan.single))for(const it of shuffle(P.qs).slice(0,plan.per)){const p=mc(it.q,it.c,0,it.s,it.h,{visual:passageHTML(P)});p.topic='Reading comprehension';p.passage=P.title;qs.push(p);}

  return qs;}

function exMeasures(el,E){E.th??=62;const m=angleMeasures(E.th);const labs={};for(let n=1;n<=8;n++)labs[n]=Math.round(m[n])+'°';

function exSlope(el,E){E.A??={x:-2,y:1};E.B??={x:4,y:5};E.next??='A';const {A,B}=E;
  const rise=B.y-A.y,run=B.x-A.x;const m=run===0?null:new Q(rise,run);

function exEq(el,E){E.m??=1;E.b??=2;E.par??=false;E.perp??=false;const P={x:-4,y:3};
  const m=new Q(Math.round(E.m*2),2),lines=[{m:E.m,b:E.b,color:C_COL}];let extra='';

function exDist(el,E){E.m??=2;E.b??=0;E.P??={x:0,y:5};const {m,b,P}=E;

function bindExam(){app.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>reviewTest(+b.dataset.review));app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startTest(b.dataset.start,+b.dataset.n,+b.dataset.m));

function startTest(section,n,mins){T={section,qs:buildTest(section,n),ans:{},flag:{},i:0,start:Date.now(),limit:mins*60,done:false,confirm:false,saved:false};S.view='test';setHash();render();window.scrollTo(0,0);}

  ${T.confirm?`<div class="fb bad" style="margin-bottom:12px">You have ${n-ansd} unanswered question${n-ansd===1?'':'s'}. On the real test there is no penalty for guessing — fill them in! <button class="btn ghost" id="reallySubmit" style="margin-left:8px">Submit anyway</button></div>`:''}
  <div class="card"><div class="${q.visual?'two':''}">${q.visual?`<div class="vis${q.passage?' pvis':''}">${q.visual}</div>`:''}<div><div class="skilltag">${q.topic}</div><div class="q">${q.prompt}</div>

  <div class="actions"><button class="btn ghost" id="prevQ" ${T.i===0?'disabled':''}>← Previous</button><button class="btn ghost" id="flagQ">${T.flag[T.i]?'⚑ Unflag':'⚐ Flag for review'}</button>${T.i<n-1?`<button class="btn" id="nextQ">Next →</button>`:`<button class="btn good" id="submitTest2">Finish & submit</button>`}</div></div></div></div>
  <div class="navgrid">${T.qs.map((_,k)=>`<button class="${k===T.i?'cur':''} ${T.ans[k]!=null?'ans':''} ${T.flag[k]?'flg':''}" data-go="${k}">${k+1}</button>`).join('')}</div>
  <p class="small muted">Answered ${ansd} of ${n}. ⚐ = flagged. Your answers aren't checked until you submit.</p>`;}
function bindTest(){if(!T)return;if(T.done){bindResults();return;}
  const q=id=>document.getElementById(id);stopTimer();TIMER=setInterval(()=>{const el=q('timer');const r=remaining();if(el){el.textContent=mmss(r);el.classList.toggle('low',r<=120);}if(r<=0){finishTest();}},1000);
  app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{T.ans[T.i]=+b.dataset.pick;rerender();});
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{T.i=+b.dataset.go;render();window.scrollTo(0,0);});
  if(q('prevQ'))q('prevQ').onclick=()=>{T.i--;render();window.scrollTo(0,0);};
  if(q('nextQ'))q('nextQ').onclick=()=>{T.i++;render();window.scrollTo(0,0);};

  const sub=()=>{const un=T.qs.length-Object.keys(T.ans).length;if(un>0&&!T.confirm){T.confirm=true;rerender();window.scrollTo(0,0);return;}finishTest();};
  if(q('submitTest'))q('submitTest').onclick=sub;if(q('submitTest2'))q('submitTest2').onclick=sub;if(q('reallySubmit'))q('reallySubmit').onclick=finishTest;}
function finishTest(){stopTimer();if(!T||T.done)return;T.done=true;T.sec=Math.min(T.limit,Math.floor((Date.now()-T.start)/1000));T.c=T.qs.filter((q,k)=>T.ans[k]===q.answer).length;
  if(!T.saved){T.t=Date.now();examHist().push({t:T.t,section:T.section,n:T.qs.length,c:T.c,sec:T.sec,lim:T.limit,ans:Object.assign({},T.ans),qs:T.qs.map(q=>({topic:q.topic,prompt:q.prompt,choices:q.choices,answer:q.answer,steps:q.steps,visual:q.visual||'',passage:!!q.passage}))});T.saved=true;saveHist();}render();window.scrollTo(0,0);}

/* ---------- weak-topic practice ---------- */
function weakGen(section,name){
  if(section==='math'){const t=MATH_TOPICS.find(x=>x[0]===name);return t?()=>pick(t[2])():null;}
  if(name==='Reading comprehension')return genPassage;if(name==='Paired passages')return genPair;
  const t=ELA_TOPICS.find(x=>x[0]===name);return t?bank(t[1]):null;}
function makeWeakLesson(w){const skills=w.topics.map(n=>[n,weakGen(w.sec?w.sec[n]:w.section,n)]).filter(x=>x[1]);if(!skills.length)return null;
  const l=L('Weak','My weak topics',`Targeted ${w.section==='math'?'math':w.section==='ela'?'language arts':''} practice from ${w.sec?'topics you picked on':'your test on'} ${new Date(w.at).toLocaleDateString('en-US',{month:'short',day:'numeric'})}: ${w.topics.join(', ')}.`,[],skills);l.id='weak';
  LESSON_IDX.weak=l;HOME_UNIT.weak=99;return l;}
function initWeak(){if(store._weak)makeWeakLesson(store._weak);}
function weakFromTest(){const by={};T.qs.forEach((q,k)=>{const b=by[q.topic]||(by[q.topic]={c:0,n:0});b.n++;if(T.ans[k]===q.answer)b.c++;});
  return Object.entries(by).filter(([,b])=>b.c<b.n).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).map(([t])=>t).slice(0,6);}

  app.innerHTML=h;bind();
}
function unitStats(U){let m=0,solved=0;for(const l of U.lessons){const p=prog(l.id);solved+=p.c;if(p.c>=GOAL)m++;}return {m,solved,n:U.lessons.length};}
function homeView(){
  const cur=byId(CURRENT);
  return `<section class="hero"><div><span class="tag">Geometry 8 · full course</span><h1>Learn it, see it, practice it — one step at a time.</h1>
  <p class="muted">Every lesson has short <b>Learn</b> cards with pictures and worked examples, then <b>Practice</b> with brand-new problems every time, hints, and full step-by-step solutions. Unit 3 also has <b>Explore</b> playgrounds.</p>
  <div class="actions"><button class="btn" data-lesson="${CURRENT}" data-u="${CURRENT_UNIT}">Continue with ${cur.code}: ${cur.title} →</button></div></div>
  <div class="vis">${tDiagram({theta:62,arrows:true,hl:hl2(3,6),labels:{3:'62°',6:'62°'}})}</div></section>
  ${examBanner()}<h2>Units</h2><div class="lessons">${COURSE.map(unitTile).join('')}</div>`;
}
function unitTile(U){const st=unitStats(U),pct=Math.round(st.m/st.n*100),cur=U.num===CURRENT_UNIT;
  return `<button class="lesson${cur?' current':''}" data-unit="${U.num}"><span class="code">${U.num}</span><span style="flex:1"><span class="t">${U.title}</span>
  <span class="d" style="display:block">${U.lessons.map(l=>l.code).join(' · ')}</span>
  ${cur?'<span class="badge here">You are here</span> ':''}${st.m===st.n?'<span class="badge done">Unit mastered ✓</span>':st.solved?`<span class="badge">${st.m}/${st.n} lessons mastered</span>`:''}
  <span class="meter" style="display:block"><i style="width:${pct}%"></i></span></span></button>`;}
function unitView(){const U=UNITS.find(u=>u.num===S.unit);
  return `<div class="lhead"><div><div class="code"><a href="#home" data-home="1">All units</a> › Unit ${U.num}${U.weeks?' · '+U.weeks:''}</div><h1 style="margin:0">Unit ${U.num}: ${U.title}</h1></div></div>
  ${U.intro?`<p class="muted" style="margin-top:-6px">${U.intro}</p>`:''}
  <div class="lessons">${U.lessons.map(l=>lessonTile(l,U)).join('')}${lessonTile(U.mix,U)}</div>`;}
function lessonTile(l,U){const p=prog(l.id),pct=Math.min(100,Math.round(p.c/GOAL*100)),mast=p.c>=GOAL,cur=l.id===CURRENT;
  const elsewhere=HOME_UNIT[l.id]!==U.num?`<span class="badge">also in Unit ${HOME_UNIT[l.id]}</span> `:'';
  return `<button class="lesson${cur?' current':''}" data-lesson="${l.id}" data-u="${U.num}"><span class="code">${l.code}</span><span style="flex:1"><span class="t">${l.title}</span><span class="d" style="display:block">${l.desc}</span>
  ${cur?'<span class="badge here">You are here</span> ':''}${elsewhere}${mast?'<span class="badge done">Mastered ✓</span>':p.a?`<span class="badge">${p.c} solved</span>`:''}
  <span class="meter" style="display:block"><i style="width:${pct}%"></i></span></span></button>`;}
function lessonView(){
  const l=byId(S.lesson),U=UNITS.find(u=>u.num===S.unit)||unitOf(l.id);const tabs=tabsFor(l);if(!tabs.includes(S.tab))S.tab=tabs[0];
  const lab=t=>t==='learn'?'Learn':t==='explore'?'Explore':'Practice';
  const crumb=U.exam?`<a href="#exam" data-exam="1">MCVSD Exam Prep</a>`:`<a href="#unit-${U.num}" data-unit="${U.num}">Unit ${U.num}: ${U.title}</a>`;
  let h=`<div class="lhead"><div><div class="code"><a href="#home" data-home="1">All units</a> › ${crumb}${l.id===CURRENT?' · you are here':''}</div><h1 style="margin:0">${l.code==='Mix'||U.exam?'':l.code+' '}${l.title}</h1></div>
   <div class="tabs">${tabs.map((t,i)=>`<button class="tab${S.tab===t?' on':''}" data-tab="${t}">${tabs.length>1?(i+1)+' · ':''}${lab(t)}</button>`).join('')}</div></div>
   <div class="seg lessonpills">${U.lessons.map(x=>`<button class="${x.id===l.id?'on':''}" data-lesson="${x.id}" data-u="${U.num}">${U.exam?(x.code.startsWith('C')?'Class '+x.code.slice(1):x.code==='M4'?'Mixed math':x.title.split(/[,&(]/)[0].trim()):x.code}</button>`).join('')}${U.exam?'':`<button class="${U.mix.id===l.id?'on':''}" data-lesson="${U.mix.id}" data-u="${U.num}">Mix</button>`}</div>`;
  if(S.tab==='learn')h+=learnView(l);else if(S.tab==='explore')h+=`<div class="card" id="explore"></div>`;else h+=practiceView(l);
  return h;
}
function learnView(l){const i=Math.min(S.card[l.id]||0,l.cards.length-1),c=l.cards[i],n=l.cards.length;const nextTab=l.explore?'explore':'practice';
  return `<div class="card lcard"><div class="skilltag">Card ${i+1} of ${n}</div><h2>${c.t}</h2><div class="body">${c.b()}</div>
  <div class="lfoot"><button class="btn ghost" data-card="${i-1}" ${i===0?'disabled':''}>← Back</button><div class="dots">${l.cards.map((_,k)=>`<i class="${k===i?'on':''}" data-card="${k}" title="Card ${k+1}"></i>`).join('')}</div>
  ${i<n-1?`<button class="btn" data-card="${i+1}">Next →</button>`:`<button class="btn" data-tab="${nextTab}">${l.explore?'Go explore →':'Start practice →'}</button>`}</div></div>`;}

/* ---------- practice ---------- */
function newProblem(){const l=byId(S.lesson);const sk=S.skill==='all'?l.skills:l.skills.filter(s=>s.id===S.skill);
  for(let k=0;k<20;k++){const s=pick(sk);let p=null;try{p=s.gen();}catch(e){console.error(s.name,e);}
    if(p){p.skillName=s.name;S.prob=p;break;}}
  S.tries=0;S.done=false;S.shown=0;S.rec=false;S.fb=null;S.picked={};S.vals=null;S.fieldOk=null;S.rowOk=null;}
function practiceView(l){
  if(!S.prob)newProblem();const p=prog(l.id),pr=S.prob;
  let h=`<div class="pbar"><div class="stat"><b>${p.c} / ${GOAL}</b>solved first try ${p.c>=GOAL?'· mastered ✓':''}<div class="meter" style="width:140px"><i style="width:${Math.min(100,p.c/GOAL*100)}%"></i></div></div>
   <div class="stat"><b>${p.s} 🔥</b>streak (best ${p.best})</div><div class="stat"><b>${p.a?Math.round(p.c/p.a*100):0}%</b>accuracy</div></div>
   ${l.skills.length>1?`<div class="skillpick seg"><button class="${S.skill==='all'?'on':''}" data-skill="all">All skills</button>${l.skills.map(s=>`<button class="${S.skill===s.id?'on':''}" data-skill="${s.id}">${s.name}</button>`).join('')}</div>`:''}`;
  h+=`<div class="card"><div class="${pr.visual?'two':''}">${pr.visual?`<div class="vis">${pr.visual}</div>`:''}<div><div class="skilltag">${pr.skillName}</div><div class="q">${pr.prompt}</div>${answerUI(pr)}
   <div id="fb">${fbHTML()}</div>
   <div class="actions">${S.done?`<button class="btn good" id="next">Next problem →</button>`:`${pr.kind==='mc'?'':'<button class="btn" id="check">Check</button>'}<button class="btn soft" id="hint">💡 Hint</button>`}${!S.shown?`<button class="btn ghost" id="show">Show me how</button>`:''}${!S.done?`<button class="btn ghost" id="skip">Skip</button>`:''}</div>
   ${stepsHTML()}</div></div></div>`;
  return h;
}
function answerUI(pr){const dis=S.done?'disabled':'';
  if(pr.kind==='mc')return `<div class="choices">${pr.choices.map((c,i)=>`<button class="choice ${S.picked[i]==='w'?'wrong':''} ${(S.done&&i===pr.answer)?'right':''}" data-ch="${i}" ${dis}>${c}</button>`).join('')}</div>`;
  if(pr.kind==='num')return `<div class="answer-row">${pr.pre?`<span class="fieldlbl">${pr.pre}</span>`:''}<input id="ans" inputmode="text" autocomplete="off" placeholder="${pr.inputHint||'your answer'}" value="${S.vals?S.vals[0]:''}" class="${S.done?'right':S.fb==='bad'?'wrong':''}" ${dis}>${pr.unit?`<span>${pr.unit}</span>`:''}</div>`;
  if(pr.kind==='multi')return `<div class="answer-row">${pr.fields.map((f,i)=>`<span class="fieldlbl">${f.label}</span><input data-f="${i}" autocomplete="off" placeholder="${pr.inputHint||''}" value="${S.vals?S.vals[i]??'':''}" class="${S.done||(S.fieldOk&&S.fieldOk[i])?'right':(S.fieldOk&&!S.fieldOk[i])?'wrong':''}" ${dis} style="width:${pr.fw||100}px">`).join('')}</div>`;
  if(pr.kind==='proof'){const opts=pr.proof.bank||REASONS;return `<table class="proof"><tr><th style="width:36%">Statement</th><th>Reason</th></tr>${pr.proof.rows.map((r,i)=>{const v=S.vals?S.vals[i]:'';const st=S.rowOk?(S.rowOk[i]?'right':'wrong'):'';
    return `<tr><td>${i+1}. ${r[0]}</td><td><select data-r="${i}" class="${S.done?'right':st}" ${dis}><option value="">— choose —</option>${opts.map(o=>`<option ${(S.done?r[1]:v)===o?'selected':''}>${o}</option>`).join('')}</select></td></tr>`;}).join('')}</table>`;}
  return '';
}
const PRAISE=['Nice work! ✓','Correct! ✓','Exactly right! ✓','You got it! ✓','Great thinking! ✓'];
function fbHTML(){if(!S.fb)return '';
  if(S.fb==='good')return `<div class="fb good">${S.tries===1?pick(PRAISE):'Correct now — nice persistence! ✓'}${S.prob.finalH?` Answer: ${S.prob.finalH}`:''}</div>`;
  if(S.fb==='bad')return `<div class="fb bad">${S.tries>=2?'Not quite. Check the step-by-step solution below and compare it with your work.':'Not quite — try once more, or tap 💡 Hint.'}</div>`;
  if(S.fb==='hint')return `<div class="fb hint">💡 ${S.prob.hint}</div>`;
  if(S.fb==='empty')return `<div class="fb hint">Type or choose an answer first.</div>`;
  if(S.fb==='bad-hint')return `<div class="fb bad">Not quite — try once more.</div><div class="fb hint">💡 ${S.prob.hint}</div>`;
  return '';}
function stepsHTML(){const pr=S.prob;if(!S.shown)return '';const n=pr.steps.length,k=Math.min(S.shown,n);
  return `<div class="steps"><b>Step by step</b><ol>${pr.steps.slice(0,k).map(s=>`<li>${s}</li>`).join('')}</ol>${k<n?`<div class="actions"><button class="btn soft" id="nstep">Next step (${k}/${n})</button><button class="btn ghost" id="allsteps">Show all</button></div>`:''}</div>`;}
function record(ok){if(S.rec)return;S.rec=true;const p=prog(S.lesson);p.a++;if(ok){p.c++;p.s++;p.best=Math.max(p.best,p.s);}else p.s=0;save();}
function doCheck(choice){const pr=S.prob;let ok=false;
  if(pr.kind==='mc'){ok=choice===pr.answer;if(!ok)S.picked[choice]='w';}
  else if(pr.kind==='num'){const v=document.getElementById('ans').value;S.vals=[v];if(!v.trim()){S.fb='empty';return rerender();}ok=near(parseAns(v),pr.answer,pr.tol);}
  else if(pr.kind==='multi'){const vs=[...document.querySelectorAll('[data-f]')].map(x=>x.value);S.vals=vs;if(vs.some(v=>!v.trim())){S.fb='empty';return rerender();}
    if(pr.unordered){const a=vs.map(parseAns),t=pr.fields.map(f=>f.answer);const used=new Set();S.fieldOk=a.map(u=>{const j=t.findIndex((x,k)=>!used.has(k)&&near(u,x,pr.fields[k].tol));if(j>=0){used.add(j);return true;}return false;});}
    else S.fieldOk=pr.fields.map((f,i)=>near(parseAns(vs[i]),f.answer,f.tol));ok=S.fieldOk.every(Boolean);}
  else if(pr.kind==='proof'){const vs=[...document.querySelectorAll('[data-r]')].map(x=>x.value);S.vals=vs;if(vs.some(v=>!v)){S.fb='empty';return rerender();}S.rowOk=pr.proof.rows.map((r,i)=>vs[i]===r[1]);ok=S.rowOk.every(Boolean);}
  S.tries++;record(ok);
  if(ok){S.done=true;S.fb='good';}
  else{S.fb='bad';if(S.tries>=2){S.done=true;S.shown=pr.steps.length;}}
  rerender();}
function rerender(){const y=window.scrollY;render();window.scrollTo(0,y);}
function saveVals(){const pr=S.prob;if(S.done)return;
  if(pr.kind==='num'){const a=document.getElementById('ans');if(a)S.vals=[a.value];}
  else if(pr.kind==='multi')S.vals=[...document.querySelectorAll('[data-f]')].map(x=>x.value);
  else if(pr.kind==='proof')S.vals=[...document.querySelectorAll('[data-r]')].map(x=>x.value);}

/* ---------- events ---------- */
function bind(){
  app.querySelectorAll('[data-home]').forEach(b=>b.onclick=e=>{e.preventDefault();goHome();});
  app.querySelectorAll('[data-unit]').forEach(b=>b.onclick=e=>{e.preventDefault();goUnit(+b.dataset.unit);});
  app.querySelectorAll('[data-exam]').forEach(b=>b.onclick=e=>{e.preventDefault();goExam();});
  if(S.view==='exam')bindExam();if(S.view==='test')bindTest();
  app.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{const id=b.dataset.lesson;goLesson(id,id===S.lesson?S.tab:'learn',b.dataset.u!=null?+b.dataset.u:undefined);});
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>goLesson(S.lesson,b.dataset.tab,S.unit));
  app.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{S.card[S.lesson]=+b.dataset.card;render();window.scrollTo(0,0);});
  if(S.view==='lesson'&&S.tab==='explore')renderExplore();
  if(S.view==='lesson'&&S.tab==='practice'){
    app.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{S.skill=b.dataset.skill;newProblem();render();});
    app.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{if(!S.done)doCheck(+b.dataset.ch);});
    const q=id=>document.getElementById(id);
    if(q('check'))q('check').onclick=()=>doCheck();
    if(q('hint'))q('hint').onclick=()=>{saveVals();S.fb=S.fb==='bad'?'bad-hint':'hint';rerender();};
    if(q('show'))q('show').onclick=()=>{saveVals();S.shown=1;if(!S.done)record(false);rerender();};
    if(q('nstep'))q('nstep').onclick=()=>{saveVals();S.shown++;rerender();};
    if(q('allsteps'))q('allsteps').onclick=()=>{saveVals();S.shown=S.prob.steps.length;rerender();};
    if(q('next'))q('next').onclick=()=>{newProblem();rerender();const f=document.querySelector('#ans,[data-f]');if(f)f.focus({preventScroll:true});};
    if(q('skip'))q('skip').onclick=()=>{newProblem();rerender();};
    app.querySelectorAll('#ans,[data-f]').forEach(inp=>inp.onkeydown=e=>{if(e.key==='Enter'&&!S.done)doCheck();});
  }
}
if(typeof initWeak==='function')initWeak();
fromHash();render();

</script>
